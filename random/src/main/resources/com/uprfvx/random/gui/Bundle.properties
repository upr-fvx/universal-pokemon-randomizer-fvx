GUI.pleaseUseTheLauncher=<html>The randomizer was not started via the launcher. You will not be able to load 3DS games into the randomizer.<br /><br />To randomize 3DS games, please start the randomizer by double-clicking on the appropriate launcher<br/>for your operating system (e.g., use launcher_WINDOWS.bat on Windows).<br /><br />If you are seeing this message despite using the launcher, make sure that you are using the<br />launcher bundled with version 4.2.0 (or later) of the randomizer.
GUI.invalidRomMessage=The selected ROM does not appear to be a clean, official ROM.\nThe randomizer will still attempt to load it, but you may experience issues.
GUI.tmFollowEvolutionsCheckBox.text=Follow Evolutions
GUI.tmFollowEvolutionsCheckBox.toolTipText=<html>When this is selected and TM compatibility is randomized, evolutions of a Pokémon will inherit that Pokémon's TM compatibilities.<br />Additionally, when a Pokémon evolves, each TM will have:<br /><b>Random (prefer same type)</b>: A 90% chance of becoming learnable if the Pokémon just gained its type through evolution, a 10% chance otherwise.<br/><b>Random (completely)</b>: A 25% chance of becoming learnable regardless of type.
GUI.mtFollowEvolutionsCheckBox.text=Follow Evolutions
GUI.mtFollowEvolutionsCheckBox.toolTipText=<html>When this is selected and move tutor compatibility is randomized, evolutions of a Pokémon will inherit that Pokémon's move tutor compatibilities.<br />Additionally, when a Pokémon evolves, each move will have:<br /><b>Random (prefer same type)</b>: A 90% chance of becoming learnable if the Pokémon just gained its type through evolution, a 10% chance otherwise.<br/><b>Random (completely)</b>: A 25% chance of becoming learnable regardless of type.
GUI.stpFixMusicAllCheckBox.text=Fix Music
GUI.stpFixMusicAllCheckBox.toolTipText=<html>Fixes the music for all Static Pokémon encounters so that even when randomized, encounters that should have special music will play the correct song.<br />Note that in Gen 4/5, if special music is assigned to a Pokémon then it will <b>always</b> play when battling that Pokémon, even if you just find it normally in the wild.
