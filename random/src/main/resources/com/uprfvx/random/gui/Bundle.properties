
#region Header
GUI.header.versionLabel.text=Randomizer Version FVX %s
GUI.header.romInformationPanel.title=ROM Information
GUI.header.noRomLoaded=NO ROM LOADED
GUI.header.openROMButton.text=Open ROM
GUI.header.openROMButton.toolTipText=
GUI.header.randomizeSaveButton.text=<html><u>Randomize (Save)</u>
GUI.header.premadeSeedButton.text=Premade Seed
GUI.header.settingsButton.text=Settings
GUI.header.settingsButton.toolTipText=
GUI.header.raceModeCheckBox.text=Race Mode
GUI.header.raceModeCheckBox.toolTipText=<html>\
  Select this to enable certain things which are useful for a speedrun race of the ROM you create.<br />\
  The ability to save a log file will be disabled, and a check value will be generated.<br />\
  You can send this value around with the preset file to ensure that everyone has the same ROM to race with.
GUI.header.loadSettingsButton.text=Load Settings
GUI.header.loadSettingsButton.toolTipText=<html>\
  Clicking this button allows you to load predefined settings from a file.<br />\
  If the current game has options that are not present in the file, those options will be set to their defaults \
  (typically "Unchanged" or Off).<br />\
  If the file has options not supported by the current game, those options will be ignored.
GUI.header.saveSettingsButton.text=Save Settings
GUI.header.saveSettingsButton.toolTipText=<html>\
  Clicking this will allow you to save the current randomization settings as a file.<br />\
  You can then load these settings when you are randomizing any ROM.<br />\
  The way in which ROMs with more or less features than the current one<br />\
  are handled is described when you hover over the "Load Settings" button.
GUI.header.wikiLinkLabel.text=<html><a href="">Wiki</a>
GUI.header.websiteLinkLabel.text=<html><a href="">Release page (latest version: %s)</a>
#endregion

#region General Options tab
GUI.generalTab.title=General Options

#Cosmetic Options panel
GUI.generalTab.cosmeticPanel.title=Cosmetic options
GUI.generalTab.cosmeticPanel.randomizeIntroMonCheckBox.text=Randomize Intro Pokémon
GUI.generalTab.cosmeticPanel.randomizeIntroMonCheckBox.toolTipText=<html>\
  If checked, the Pokémon sent out by the professor in the intro, will not be randomized.<br>\
  In HGSS, the intro Pokémon is Ethan's/Lyra's Marill.
GUI.generalTab.cosmeticPanel.randomizeCatchingTutorialCheckBox.text=Randomize Catching Tutorial
GUI.generalTab.cosmeticPanel.randomizeCatchingTutorialCheckBox.toolTipText=<html>\
  Selecting this option will randomize the Pokémon participating in the game's catching tutorial.
GUI.generalTab.cosmeticPanel.lowerCaseSpeciesNamesCheckBox.text=Lower Case Species Names
GUI.generalTab.cosmeticPanel.lowerCaseSpeciesNamesCheckBox.toolTipText=<html>\
  If this is selected, all Pokémon species names will be made into Camel Case.<br />\
  e.g. VENUSAUR becomes Venusaur.<br />\
  This looks better in Gen3/Gen4 games, and OK in Gen1/Gen2 games.
GUI.generalTab.cosmeticPanel.randomizeTrainerNamesCheckBox.text=Randomize Trainer Names
GUI.generalTab.cosmeticPanel.randomizeTrainerNamesCheckBox.toolTipText=<html>\
  Check this to randomize trainers' names when you fight them.<br />\
  For RBY, this only includes the Gym Leaders and Elite 4, as no-one else has names.<br />\
  For every other game this will replace the names of each individual trainer.
GUI.generalTab.cosmeticPanel.randomizeTrainerClassNamesCheckBox.text=Randomize Trainer Class Names
GUI.generalTab.cosmeticPanel.randomizeTrainerClassNamesCheckBox.toolTipText=<html>\
  Check this to randomize the class names to new names (e.g. "Youngster" could become "Misfit").<br />\
  The trainers in each class will remain the same.

#Limit Random Species panel
GUI.generalTab.limitPanel.title=Limit Random Pokémon Species
GUI.generalTab.limitPanel.banSpeciesPanel.title=Ban species from:
GUI.generalTab.limitPanel.banGeneration1CheckBox.text=Generation 1
GUI.generalTab.limitPanel.banGeneration2CheckBox.text=Generation 2
GUI.generalTab.limitPanel.banGeneration3CheckBox.text=Generation 3
GUI.generalTab.limitPanel.banGeneration4CheckBox.text=Generation 4
GUI.generalTab.limitPanel.banGeneration5CheckBox.text=Generation 5
GUI.generalTab.limitPanel.banGeneration6CheckBox.text=Generation 6
GUI.generalTab.limitPanel.banGeneration7CheckBox.text=Generation 7
GUI.generalTab.limitPanel.banGenerationXCheckBox.toolTipText=<html>\
  If this is selected, the randomizer will not choose Pokémon species introduced in this generation anywhere in the \
  game.<br />\
  Non-randomized places are not affected.
GUI.generalTab.limitPanel.allowRelativesCheckBox.text=Allow evolutionary relatives
GUI.generalTab.limitPanel.allowRelativesCheckBox.toolTipText=If this is checked, Pokémon species from banned \
  generations may be chosen if they are related by evolution to a species of a non-banned generation.
GUI.generalTab.limitPanel.banTemporaryFormesCheckBox.text=No Temporary Formes
GUI.generalTab.limitPanel.banTemporaryFormesCheckBox.toolTipText=<html>\
  Bans temporary alternate formes from the species pool when "Allow Alternate Formes" is selected for Wild Encounters, \
  Trainer Pokémon, Evolutions, etc.<br />\
  Temporary formes are those that normally cannot exist outside of battle (such as Mega Evolutions and other in-battle \
  transformations like Darmanitan-Z, Zygarde-C, etc.),<br />\
  as well as the "Fusion" Pokémon (Kyurem-B/W and Necrozma-DM/DW).<br />\
  These alternate formes still exist and will get randomized base stats, abilities and so on (according to your \
  settings),<br />\
  but they can only be accessed through their regular means (such as by Mega Evolving or transforming because of an \
  Ability).
GUI.generalTab.limitPanel.retainAltFormesCheckBox.text=Don't Revert Temporary Alt Formes
GUI.generalTab.limitPanel.retainAltFormesCheckBox.toolTipText=<html>\
  Lets all party Pokémon that are in an alternate forme retain their alternate forme when the game is reset.<br />\
  Without this setting, Mega Evolutions, Primal Reversions, Ash-Greninja, Zygarde Complete Forme, and Ultra Necrozma \
  will revert to their base forme upon reset.<br />\
  In ORAS and Gen 7, this setting also prevents certain alternate formes from being reverted after a battle if these \
  formes are <i>not</i> the result of an in-battle transformation.<br />This includes Primal Groudon, Primal Kyogre, \
  Wishiwashi School Form, and Minior.
GUI.generalTab.limitPanel.noPrematureEvosCheckbox.text=No Premature Evolutions
GUI.generalTab.limitPanel.noPrematureEvosCheckbox.toolTipText=<html>\
  If this is checked, any randomly chosen Pokémon species will not be prematurely evolved, i.e., only species that \
  cannot evolve at the given level are chosen.<br />\
  For any species that does not evolve by level up, its Estimated Evolution Level is used which is deduced from all \
  level up evolutions.<br />\
  Currently affects:<ul>\
  <li> Trainer Pokémon (note that the evolution levels there are affected by the percentage slider below 'Trainers \
  Evolve their Pokémon') and\
  <li>Wild Encounters, if neither 'Same Evolution Stage' nor 'Keep Relations' is selected.</ul>
#Quality of Life Tweaks panel
GUI.generalTab.QOLTweaksPanel.title=Quality of Life Tweaks
GUI.generalTab.tweaksNoneLabel.text=There are no tweaks available for the currently loaded game.
GUI.generalTab.QOLTweaksPanel.fastestTextCheckBox.text=Fastest Text
GUI.generalTab.QOLTweaksPanel.fastestTextCheckBox.toolTipText=<html>\
  Selecting this option will make all text boxes in the game show up with minimum delay, regardless of the text \
  speed the player sets in Options.<br />\
  <b>Credit to Dabomstew/Revo for Gen 3, Kaphotics for Gen 4, Ajarmar for Gen 5, and unknown cheat code makers \
  for Gen 6/7</b>
GUI.generalTab.QOLTweaksPanel.runIndoorsCheckBox.text=Run Indoors
GUI.generalTab.QOLTweaksPanel.runIndoorsCheckBox.toolTipText=<html>\
  Selecting this option will allow you to run in any location, just like in later games.
GUI.generalTab.QOLTweaksPanel.nationalDexCheckBox.text=Give National Dex at Start
GUI.generalTab.QOLTweaksPanel.nationalDexCheckBox.toolTipText=<html>\
  If this is checked then the National Dex will be given to the player at the start of the game with the regular \
  Pokédex.<br />\
  It is useful for tracking Pokémon species outside the regional dex when using the Pokédex.<br />\
  <b>Important caveats:</b><br />\
  <b>For FRLG only:</b> this setting is <i>necessary</i> for Kanto Pokémon to evolve into Non-Kanto species, \
  i.e. Golbat evolving into Crobat.<br />\
  <b>For DPPt only:</b> the National Dex will instead be obtained after speaking to Professor Rowan once after \
  obtaining the regular Pokédex.

GUI.generalTab.QOLTweaksPanel.runWithoutRunningShoesCheckBox.text=Run Without Running Shoes
GUI.generalTab.QOLTweaksPanel.runWithoutRunningShoesCheckBox.toolTipText=<html>\
  Allows you to run before acquiring the Running Shoes.
GUI.generalTab.QOLTweaksPanel.fasterHpAndExpBarsCheckBox.text=Faster HP and EXP Bars
GUI.generalTab.QOLTweaksPanel.fasterHpAndExpBarsCheckBox.toolTipText=<html>\
  Doubles the scrolling speed of the HP and EXP bars that appear in battle.<br />\
  In practice, this makes them scroll at the same speed as in the Gen 3 games.
GUI.generalTab.QOLTweaksPanel.fastDistortionWorldCheckBox.text=Fast Distortion World
GUI.generalTab.QOLTweaksPanel.fastDistortionWorldCheckBox.toolTipText=<html>\
  Cuts out most of the Distortion World by instantly warping you to the Cyrus fight when you enter it.
GUI.generalTab.QOLTweaksPanel.disableLowHpMusicCheckBox.text=Disable Low HP Music
GUI.generalTab.QOLTweaksPanel.disableLowHpMusicCheckBox.toolTipText=<html>\
  Disables the music that plays when one of the player's Pokémon is at low HP in battle, \
  ensuring that the current song will continue playing no matter what.
GUI.generalTab.QOLTweaksPanel.reusableTMsCheckBox.text=Reusable TMs
GUI.generalTab.QOLTweaksPanel.reusableTMsCheckBox.toolTipText=<html>\
  Makes TMs infinitely reusable.<br />\
  TMs will still act different from HMs in minor ways, such as being tossable/holdable/storable, \
  but their number will never decrease when used.
GUI.generalTab.QOLTweaksPanel.forgettableHMsCheckBox.text=Forgettable HMs
GUI.generalTab.QOLTweaksPanel.forgettableHMsCheckBox.toolTipText=<html>\
  Makes HM moves forgettable like any other move.<br />\
  <b>Note:</b> If HMs are forgotten in the wrong locations, it is possible to softlock the game.<br />\
  Be extra careful when releasing Pokémon and (in Gen 1) storing the HM items in your PC.
GUI.generalTab.QOLTweaksPanel.fastEggHatchingCheckBox.text=Fast Egg Hatching
GUI.generalTab.QOLTweaksPanel.fastEggHatchingCheckBox.toolTipText=<html>\
  Makes all eggs hatch in as few egg cycles as possible. Generally, this means all eggs will hatch in 256 steps or fewer.

#Balance Tweaks panel
GUI.generalTab.balanceTweaksPanel.title=Balance Tweaks
GUI.generalTab.balanceTweaksPanel.nerfXAccuracyCheckBox.text=Nerf X Accuracy
GUI.generalTab.balanceTweaksPanel.nerfXAccuracyCheckBox.toolTipText=<html>\
  X Accuracy in Generation 1 games is a pretty broken item, given that it gives 100% accuracy to any and all moves \
  used.<br />\
  Apply this code tweak to stop X Accuracy from working on sleep moves, trapping moves & one-hit KO moves.<br />\
  Doing this means that the player cannot use X Accuracy and lock the opponents into infinite sleep/Wrap, nor can \
  they just use one-hit KO moves on everything.<br />\
  Applying this patch will also remove the one-hit KO moves from the "broken moves" list if you use that option, \
  since they aren't really broken without X Accuracy.<br />\
  <b>Credit to Mountebank for this patch.</b>
GUI.generalTab.balanceTweaksPanel.updateCritRateCheckBox.text=Update Crit Rate
GUI.generalTab.balanceTweaksPanel.updateCritRateCheckBox.toolTipText=<html>\
  Selecting this option will change Generation 1's critical hit rate to a static rate (1/16) like the later games, \
  instead of being based on Speed.<br />\
  Focus Energy and Dire Hit will also be fixed to increase crit rate instead of decreasing it.<br />\
  "High crit rate" moves such as Slash will have double the normal crit chance, like in later games.
GUI.generalTab.balanceTweaksPanel.scalingEXPCheckBox.text=Use Scaling EXP
GUI.generalTab.balanceTweaksPanel.scalingEXPCheckBox.toolTipText=<html>\
  Select this to patch the game you are randomizing to use the scaling XP gain system introduced in Generation 5.<br />\
  This system gives Pokémon more EXP when they defeat opponents of a higher level than themselves.<br />\
  This is currently available only for English R/B/Y and G/S/C.
GUI.generalTab.balanceTweaksPanel.forceChallengeModeCheckBox.text=Force Challenge Mode
GUI.generalTab.balanceTweaksPanel.forceChallengeModeCheckBox.toolTipText=<html>\
  If this is checked, then Challenge Mode will be forcibly enabled, bypassing the Key System entirely.<br />\
  <b>You will <i>not</i> be able to access Easy or Normal Mode if you enable this setting.</b>
GUI.generalTab.balanceTweaksPanel.banLuckyEggCheckBox.text=Ban Lucky Egg
GUI.generalTab.balanceTweaksPanel.banLuckyEggCheckBox.toolTipText=<html>\
  Bans Lucky Egg from showing up as any kind of randomized item.<br />\
  If the original game contains a Lucky Egg in any non-randomized place, that will still be the case.
GUI.generalTab.balanceTweaksPanel.noFreeLuckyEggCheckBox.text=No Free Lucky Egg
GUI.generalTab.balanceTweaksPanel.noFreeLuckyEggCheckBox.toolTipText=<html>\
  Causes Professor Juniper to not give you a Lucky Egg for free in the Chargestone Cave (BW)/Celestial Tower (BW2).
GUI.generalTab.balanceTweaksPanel.balanceGivenLevelsCheckBox.text=Balance Given Pokémon Levels
GUI.generalTab.balanceTweaksPanel.balanceGivenLevelsCheckBox.toolTipText=<html>\
  Changes levels of given Pokémon to be more balanced. Currently applies only to fossil Pokémon in FRLG and BW1.
GUI.generalTab.balanceTweaksPanel.noEVYieldsCheckBox.text=No EVs From Pokémon
GUI.generalTab.balanceTweaksPanel.noEVYieldsCheckBox.toolTipText=<html>\
  Makes all Pokémon give 0 EVs when defeated in battle.<br />\
  This does not affect EVs gained using other methods (Vitamins, Power items, Super Training, etc.).
#endregion

#region Species Traits tab
GUI.traitsTab.title=Species Traits

#Base Statistics panel
GUI.traitsTab.statsPanel.title=Species' Base Statistics
GUI.traitsTab.statsPanel.updateCheckBox.text=Update Base Stats to Generation:
GUI.traitsTab.statsPanel.updateCheckBox.toolTipText=<html>\
  Select this to update the base stats of Pokémon species in the loaded game to their values in the generation chosen \
  to the right.<br />\
  This does NOT:<br />\
  * Add any new Pokémon species to the game.<br />\
  * Split Special Attack and Special Defense in Gen 1.
#Base Stat Totals panel
GUI.traitsTab.statsPanel.totalsPanel.title=Base Stat Totals
GUI.traitsTab.statsPanel.totalsPanel.unchangedRadioButton.text=Unchanged
GUI.traitsTab.statsPanel.totalsPanel.unchangedRadioButton.toolTipText=Pokémon species' Base Stat Totals are not changed.
GUI.traitsTab.statsPanel.totalsPanel.randomBuffNerfRadioButton.text=Random Buff/Nerf (%)
GUI.traitsTab.statsPanel.totalsPanel.randomBuffNerfRadioButton.toolTipText=<html>\
  Each Pokémon species recieves a random increase or decrease to their BST.<br />\
  The slider below decides the maximum BST change, in percentages.<br />\
  (For example, if set to 20, a species will randomly get between 80-120% of their original BST)
GUI.traitsTab.statsPanel.totalsPanel.shuffleRadioButton.text=Shuffle
GUI.traitsTab.statsPanel.totalsPanel.shuffleRadioButton.toolTipText=<html>\
  Shuffle the BSTs of all Pokémon species.<br>\
  If there were originally 6 species with 600 BST, there will be 6 after applying this option,<br>\
  but they will be different species.<br>\
  (For example, Weedle might receive the BST of Mewtwo, Charizard the BST of Butterfree.)
GUI.traitsTab.statsPanel.totalsPanel.randomRadioButton.text=Random
GUI.traitsTab.statsPanel.totalsPanel.randomRadioButton.toolTipText=Each Pokémon gets a completely random BST.
GUI.traitsTab.statsPanel.totalsPanel.followEvolutionsCheckBox.text=Follow Evolutions
GUI.traitsTab.statsPanel.totalsPanel.followEvolutionsCheckBox.toolTipText=<html>\
  If used with "Random Buff/Nerf (%)", each Pokémon species in a family will get the same buff/nerf.<br>\
  If used with "Shuffle", BSTs will be shuffled family-by-family, going by length.<br>\
  (3-stage families will be shuffled with 3-stage families, 2-stage families with 2-stage families,<br>\
  non-evolving species with non-evolving species.)
GUI.traitsTab.statsPanel.totalsPanel.separateLegendariesCheckBox.text=Separate Legendaries
GUI.traitsTab.statsPanel.totalsPanel.separateLegendariesCheckBox.toolTipText=<html>\
  If selected, legendary Pokémon species will have their BSTs shuffled separately from all other species.<br>\
  This prevents extremes like Mewtwo getting the BST of Farfetch'd, and vice versa,<br>\
  while still allowing variation within each category.
#Base Stat Distributions panel
GUI.traitsTab.statsPanel.distPanel.unchangedRadioButton.text=Unchanged
GUI.traitsTab.statsPanel.distPanel.unchangedRadioButton.toolTipText=<html>\
  Don't change Pokémon species' stat distributions from the base at all.<br />\
  If base stat totals are changed, the difference will be added/subtracted from each stat in their existing ratio.
GUI.traitsTab.statsPanel.distPanel.shuffleRadioButton.text=Shuffle
GUI.traitsTab.statsPanel.distPanel.shuffleRadioButton.toolTipText=<html>\
  Shuffle each Pokémon species's stats.<br />\
  For example, its base Attack may be swapped with its base Special Attack, etc.<br />\
  This does not change any species' base stat total.
GUI.traitsTab.statsPanel.distPanel.randomRadioButton.text=Random
GUI.traitsTab.statsPanel.distPanel.randomRadioButton.toolTipText=<html>\
  Randomizes each Pokémon species's stats, as long as they fall within the original base stat total.<br />\
  This could make species stronger or weaker if they get unlucky or lucky rolls on stats they need.<br />\
  Evolutions of a species will be treated separately from that species unless you check Follow Evolutions.
GUI.traitsTab.statsPanel.distPanel.followEvolutionsCheckBox.text=Follow Evolutions
GUI.traitsTab.statsPanel.distPanel.followEvolutionsCheckBox.toolTipText=<html>\
  When this is selected and base stats are shuffled or randomized, evolutions of a Pokémon species will inherit from \
  their base species's rolls.<br />\
  Shuffle: The same new ordering of stats will be used.<br />\
  Randomized: The evolution will have the same proportion of stats as the base species.
GUI.traitsTab.statsPanel.distPanel.followMegaEvosCheckBox.text=Follow Mega Evolutions
GUI.traitsTab.statsPanel.distPanel.followMegaEvosCheckBox.toolTipText=<html>\
  When this is selected and base stats are shuffled or randomized, Mega Evolutions will inherit from their base \
  form's rolls.<br />\
  Shuffle: The same new ordering of stats will be used.<br />\
  Randomized: The Mega Evolution will have the same proportion of stats as the base form.<br />\
  <b>Not recommended for use in Gen 7</b> unless you know what you're doing; see the Important Information \
  page on the wiki for more info.
GUI.traitsTab.statsPanel.distPanel.assignEvoStatsRandomlyCheckBox.text=Randomize Added Stats on Evolution
GUI.traitsTab.statsPanel.distPanel.assignEvoStatsRandomlyCheckBox.tooltipText=<html>\
  When an evolution targets a Pokémon species with a higher BST, the additional stats of the evolved species \
  will be assigned randomly on top of the base species's stats <br />\
  instead of the evolved species having the exact same ratio between its stats as the base.<br /><br />\
  Applies to both regular Evolutions and Mega Evolutions (only if "Follow Evolutions"/"Follow Mega Evolutions" \
  is selected).

#Species Types panel
GUI.traitsTab.typesPanel.title=Species' Types
GUI.traitsTab.typesPanel.unchangedRadioButton.text=Unchanged
GUI.traitsTab.typesPanel.unchangedRadioButton.toolTipText=Don't change Pokémon species' types at all.
GUI.traitsTab.typesPanel.randomFollowEvolutionsRadioButton.text=Random (follow evolutions)
GUI.traitsTab.typesPanel.randomFollowEvolutionsRadioButton.toolTipText=<html>\
  Randomize the types of each Pokémon species, but make most evolutions copy the base species (except perhaps \
  adding an extra secondary type).<br />\
  Evolutions that don't copy types are the Eeveelutions, among others.
GUI.traitsTab.typesPanel.randomCompletelyRadioButton.text=Random (completely)
GUI.traitsTab.typesPanel.randomCompletelyRadioButton.toolTipText=<html>\
  Randomize Pokémon species' types completely.<br />\
  Evolutions of a species will be randomized independently of the base species, so a Pokémon's type will \
  likely completely change every evolution.
GUI.traitsTab.typesPanel.followMegaEvosCheckBox.text=Follow Mega Evolutions
GUI.traitsTab.typesPanel.followMegaEvosCheckBox.toolTipText=<html>\
  When this is selected and types are randomized, non-split Mega Evolutions of a Pokémon will inherit that \
  Pokémon's random types (perhaps adding another type).<br />\
  <b>Not recommended for use in Gen 7</b> unless you know what you're doing; \
  see the Important Information page on the wiki for more info.
GUI.traitsTab.typesPanel.forceDualTypesCheckBox.text=Force Dual Typing
GUI.traitsTab.typesPanel.forceDualTypeCheckBox.toolTipText=Checking this will force all Pokémon species to have \
  two types when types are randomized.
GUI.traitsTab.typesPanel.updateRotomCheckBox.name=Update Rotom Appliance Types
GUI.traitsTab.typesPanel.updateRotomCheckBox.toolTipText=<html>\
  Updates the typings of Rotom's alternate formes (i.e., the appliances) to match the typings they have in \
  Gen 5 and onwards.<br />\
  For example, Wash Rotom will change from Electric/Ghost to Electric/Water.


#Species Abilities panel
GUI.traitsTab.abilitiesPanel.title=Species' Abilities
GUI.traitsTab.abilitiesPanel.unchangedRadioButton.text=Unchanged
GUI.traitsTab.abilitiesPanel.unchangedRadioButton.toolTipText=Don't change Pokémon species' abilities at all.
GUI.traitsTab.abilitiesPanel.randomRadioButton.text=Random
GUI.traitsTab.abilitiesPanel.randomRadioButton.toolTipText=<html>\
  Give each Pokémon species random abilities.<br />\
  Each species will have a base ability, and a 50% chance of having a 2nd ability different from the first.<br />\
  (Half of the Pokémon of this species will have this ability).<br />\
  In Generation 5 games, each species will also receive a new random "Dream World" ability.
GUI.traitsTab.abilitiesPanel.forceTwoAbilitiesCheckbox.text=Force Two Abilities
GUI.traitsTab.abilitiesPanel.forceTwoAbilitiesCheckbox.toolTipText=<html>\
  When abilities are randomized, ensure each Pokémon species has two abilities.
GUI.traitsTab.abilitiesPanel.combineDuplicatesCheckBox.text=Combine Duplicate Abilities
GUI.traitsTab.abilitiesPanel.combineDuplicatesCheckBox.toolTipText=<html>\
  This setting causes abilities that have the exact same effect to be considered as the same ability \
  for randomization probability purposes. Every variation of the respective abilities can still appear.<br />\
  This applies to:<br />\
  <b>Gen 3+:</b> Insomnia/Vital Spirit, Clear Body/White Smoke, Huge Power/Pure Power, Battle Armor/Shell Armor, \
  Cloud Nine/Air Lock<br />\
  <b>Gen 4+:</b> Filter/Solid Rock<br />\
  <b>Gen 5+:</b> Rough Skin/Iron Barbs, Mold Breaker/Turboblaze/Teravolt<br />\
  <b>Gen 7+:</b> Wimp Out/Emergency Exit, Queenly Majesty/Dazzling, Gooey/Tangling Hair, Receiver/Power of Alchemy, \
  Clear Body/White Smoke/Full Metal Body, Multiscale/Shadow Shield, Filter/Solid Rock/Prism Armor
GUI.traitsTab.abilitiesPanel.followEvolutionsCheckBox.text=Follow Evolutions
GUI.traitsTab.abilitiesPanel.followEvolutionsCheckBox.toolTipText=<html>\
  When this is selected and abilities are randomized, non-split evolutions of a Pokémon species will inherit that \
  species's random abilities.
GUI.traitsTab.abilitiesPanel.followMegaEvosCheckBox.text=Follow Mega Evolutions
GUI.traitsTab.abilitiesPanel.followMegaEvosCheckBox.toolTipText=<html>\
  When this is selected and abilities are randomized, non-split Mega Evolutions of a Pokémon will inherit \
  that Pokémon's random abilities.<br />\
  <b>Not recommended for use in Gen 7</b> unless you know what you're doing; \
  see the Important Information page on the wiki for more info.
#Ban panel
GUI.traitsTab.abilitiesPanel.banPanel.text=Ban...
GUI.traitsTab.abilitiesPanel.banPanel.wonderGuardCheckBox.text=Wonder Guard
GUI.traitsTab.abilitiesPanel.banPanel.wonderGuardCheckBox.toolTipText=<html>\
  If this is checked, Wonder Guard will not be chosen as any Pokémon species's ability.<br />\
  Species that already have Wonder Guard (i.e. Shedinja) will not have their ability randomized.<br />\
  Recommended to maintain balance.
GUI.traitsTab.abilitiesPanel.banPanel.trappingAbilitiesCheckBox.text=Trapping Abilities
GUI.traitsTab.abilitiesPanel.banPanel.trappingAbilitiesCheckBox.toolTipText=<html>\
  When abilities are randomized, ban abilities that can prevent the opponent from fleeing/switching out from being \
  selected.<br />\
  This bans Arena Trap, Magnet Pull and Shadow Tag.<br />\
  Has no effect if abilities are not randomized.<br />\
  Pokémon species that have a trapping ability to begin with will still have their abilities randomized, unlike how \
  Wonder Guard is treated.
GUI.traitsTab.abilitiesPanel.banPanel.negativeAbilitiesCheckBox.text=Negative Abilities
GUI.traitsTab.abilitiesPanel.banPanel.negativeAbilitiesCheckBox.toolTipText=<html>\
  When abilities are randomized, ban abilities that are purely negative in nature from being chosen.<br />\
  This bans Defeatist, Slow Start, Truant, Klutz, Stall.<br />\
  Has no effect if abilities are not randomized.<br />\
  Pokémon species that have a negative ability to begin with will still have their abilities randomized, unlike how \
  Wonder Guard is treated.
GUI.traitsTab.abilitiesPanel.banPanel.minorAbilitiesCheckBox.text=Minor Abilities
GUI.traitsTab.abilitiesPanel.banPanel.minorAbilitiesCheckBox.toolTipText=<html>\
  When abilities are randomized, ban abilities that don't do anything most of the time.<br />\
  This bans Minus, Plus, Anticipation, Forewarn, Frisk, Honey Gather, Aura Break, Receiver, Power of Alchemy.<br />\
  If "Double Battle Mode" for Trainers is not selected, it also bans Friend Guard, Healer, Telepathy, Symbiosis, \
  Battery.<br />\
  Pokémon species that have a minor ability to begin with will still have their abilities randomized, unlike how \
  Wonder Guard is treated.

#Evolutions panel
GUI.traitsTab.evolutionPanel.title=Pokémon Evolutions
GUI.traitsTab.evolutionPanel.changeImpossibleCheckBox.text=Change Impossible Evolutions
GUI.traitsTab.evolutionPanel.changeImpossibleCheckBox.toolTipText=<html>\
  If this is checked, every evolution that isn't possible to do without trading in the current game \
  will be changed.<br />\
  <b>Takes effect regardless of whether evolutions are randomized or not.</b><br />\
  Some of the types that will be changed are:<ul>\
  <li>"Normal" trade evolutions\
  <li>Trade evolutions with another condition, such as held item or Pokémon traded for\
  <li>Day/night evolutions if there isn't day/night in the game\
  <li>Contest-stat evolutions if there aren't contests in the game\
  <li>Location-based evolutions, if those locations don't exist in the game\
  <li>Move-based evolutions, <b>only if you randomize movesets</b></ul>
GUI.traitsTab.evolutionPanel.removeTimeBasedCheckBox.text=Remove Time-Based Evolutions
GUI.traitsTab.evolutionPanel.removeTimeBasedCheckBox.toolTipText=<html>\
  If this is checked, evolutions that require a certain time of day will now be possible regardless of \
  the in-game time.<br />\
  Split time-based evolutions (like Eevee ⇒ Espeon/Umbreon and Rockruff ⇒ Lycanroc Midday/Midnight) \
  will be changed to stone evolutions instead.
GUI.traitsTab.evolutionPanel.allowPikachuEvolutionCheckBox.text=Allow Pikachu Evolution
GUI.traitsTab.evolutionPanel.allowPikachuEvolutionCheckBox.toolTipText=<html>\
  Selecting this option will let you evolve Pikachu into Raichu with a Thunder Stone like any other game.
GUI.traitsTab.evolutionPanel.useEstimatedLevelsCheckBox.text=Use Estimated Evolution Levels
GUI.traitsTab.evolutionPanel.useEstimatedLevelsCheckBox.toolTipText=<html>\
  If this is checked, evolutions that were changed to become level-up evolutions via the 'Change Impossible Evolutions' \
  or the 'Make Evolutions Easier' option <br />\
  will use evolution levels estimated from all other evolution levels in the current game instead of a pre-set \
  evolution level.
GUI.traitsTab.evolutionPanel.makeEasierCheckBox.text=Make Evolutions Easier
GUI.traitsTab.evolutionPanel.makeEasierCheckBox.toolTipText=<html>\
  If this is checked, Pokémon that evolve at a very high level will evolve at lower levels to make them more \
  viable for shorter playthroughs.<br />\
  Specifically, every Pokémon will evolve to its final stage by the level selected below, and three-stage evolutions \
  will reach their middle stage by no later than 75% of the level selected below.<br />\
  <b>(If the maximum value of the slider below is selected, evolutions levels will not be changed but the following \
  improvements will still apply.)</b><br />\
  Additionally, Pokémon that normally evolve by having another specific Pokémon in the party will instead evolve at \
  level 35.<br />\
  Lastly, Pokémon that evolve via friendship will evolve at 160 happiness (down from 220), similar to how it works \
  in the Switch Pokémon games.<br />\
  <b>Takes effect regardless of whether evolutions are randomized or not.</b>
GUI.traitsTab.evolutionPanel.makeEasierLevelSlider.toolTipText=<html>\
  Use this slider to select the level by which every Pokémon shall be evolved to its final stage if \
  'Make Evolutions Easier' is checked above.<br />\
  If the maximum value of this slider is selected, evolution levels will not be changed \
  (other evolution improvements of 'Make Evolutions Easier' still apply).
#Randomize panel
GUI.traitsTab.evolutionPanel.randomizePanel.title=Randomize Evolutions
GUI.traitsTab.evolutionPanel.randomizePanel.unchangedRadioButton.text=Unchanged
GUI.traitsTab.evolutionPanel.randomizePanel.unchangedRadioButton.toolTipText=Don't randomize Pokémon evolutions.
GUI.traitsTab.evolutionPanel.randomizePanel.randomRadioButton.text=Random
GUI.traitsTab.evolutionPanel.randomizePanel.randomRadioButton.toolTipText=<html>\
  Randomize which species each Pokémon species evolves into.<br />\
  Which species evolve and how will not be changed, only what species they evolve into.<br />\
  Evolutions will be mostly unrestricted unless you check some boxes to the right, but the EXP curves of the \
  species must match.<br />\
  If the randomizer has trouble randomizing Evolutions, "Standardize EXP Curves" might help.
GUI.traitsTab.evolutionPanel.randomizePanel.randomEveryLevelRadioButton.text=Random Every Level
GUI.traitsTab.evolutionPanel.randomizePanel.randomEveryLevelRadioButton.toolTipText=<html>\
  Randomize which species each Pokémon species evolves into while forcing them to evolve every single level.<br />\
  All existing evolutions for a given species will be removed and replaced with a single Level 1 evolution.<br />\
  Evolutions will be mostly unrestricted unless you check some boxes to the right, but the EXP curves of the species \
  must match.<br />\
  If the randomizer has trouble randomizing Evolutions, "Standardize EXP Curves" might help.<br />\
  Evolution "loops" are expected and intended with this setting.
GUI.traitsTab.evolutionPanel.randomizePanel.similarStrengthCheckBox.text=Similar Strength
GUI.traitsTab.evolutionPanel.randomizePanel.similarStrengthCheckBox.toolTipText=<html>\
  When this is checked, random evolutions will prefer Pokémon species with a similar BST to the original \
  evolution target.<br />\
  Has less precedence than all other modifiers below, so it may not always be strictly enforced.
GUI.traitsTab.evolutionPanel.randomizePanel.shareTypeCheckBox.text=Share Typing
GUI.traitsTab.evolutionPanel.randomizePanel.shareTypeCheckBox.toolTipText=<html>\
  When selected, randomized evolutions will share at least one type between the source and target species.
GUI.traitsTab.evolutionPanel.randomizePanel.maxThreeStageCheckBox.text=Limit Evolutions to Three Stages
GUI.traitsTab.evolutionPanel.randomizePanel.maxThreeStageCheckBox.toolTipText=<html>\
  When selected, there will not be any evolution chains created that are longer than three stages.
GUI.traitsTab.evolutionPanel.randomizePanel.allowAltFormesCheckBox.text=Allow Alternate Formes
GUI.traitsTab.evolutionPanel.randomizePanel.allowAltFormesCheckBox.toolTipText=<html>\
  Allow evolution into alternate formes of Pokémon species, including regional variants and temporary formes <br />\
  (if the "No Temporary Formes" general option is not enabled).
GUI.traitsTab.evolutionPanel.randomizePanel.forceChangeCheckBox.text=Force Change
GUI.traitsTab.evolutionPanel.randomizePanel.forceChangeCheckBox.toolTipText=<html>\
  When selected, every evolution of a Pokémon species will be randomized to something different from what it was \
  originally.
GUI.traitsTab.evolutionPanel.randomizePanel.forceGrowthCheckBox.text=Force Growth
GUI.traitsTab.evolutionPanel.randomizePanel.forceGrowthCheckBox.toolTipText=<html>\
  When this is checked, Pokémon species chosen as evolution targets will always have a higher BST than the species \
  they evolve from.
GUI.traitsTab.evolutionPanel.randomizePanel.noConvergenceCheckBox.text=No Convergence
GUI.traitsTab.evolutionPanel.randomizePanel.noConvergenceCheckBox.toolTipText=<html>\
  When this is checked, no two Pokémon species will evolve into the same species.
GUI.traitsTab.evolutionPanel.randomizePanel.adjustLevelsCheckBox.text=Adjust Evolution Levels
GUI.traitsTab.evolutionPanel.randomizePanel.adjustLevelsCheckBox.toolTipText=<html>\
  If this is checked, level-up evolutions will have their levels algorithmically adjusted,<br>\
  to better fit the Pokémon species before and after evolution.<br>\
  <b>E.g.</b>, if a species has an evolution into Dragonite, it will be at a high level.<br><br>\
  This option also affects estimated evo levels, used elsewhere in the Randomizer<br>\
  for Pokémon species that do not evolve via level-up.

#EXP Curves panel
GUI.traitsTab.EXPCurvesPanel.title=Species' EXP Curves
GUI.traitsTab.EXPCurvesPanel.standardizeEXPCurvesCheckBox.text=Standardize EXP Curves to:
GUI.traitsTab.EXPCurvesPanel.standardizeEXPCurvesCheckBox.toolTipText=<html>\
  When this is selected, every Pokémon species's EXP curve will be changed to the selected EXP curve below,<br />\
  except for the species forced to use the "Slow" EXP curve, chosen with the settings to the right.<br />\
  This will cause Pokémon species to be better or worse based more on their stats/moves/type rather than the \
  difficulty of leveling them;<br />\
  it will also allow for more potential evolutions if you randomize evolutions, since a Pokémon only can evolve into \
  a species with the same EXP curve.<br /><br />\
  If you're not sure which EXP Curve to pick, Medium Fast and Medium Slow are generally good curves \
  (most species use these in the regular games).
#TODO: put EXP curve names (for the combobox) into the bundle

GUI.traitsTab.EXPCurvesPanel.allRadioButton.text=All Species
GUI.traitsTab.EXPCurvesPanel.allRadioButton.toolTipText=All Pokémon species get the selected EXP Curve.
GUI.traitsTab.EXPCurvesPanel.legendariesSlowRadioButton.text=Legendaries: Slow
GUI.traitsTab.EXPCurvesPanel.legendariesSlowRadioButton.toolTipText=All legendaries get the "Slow" EXP Curve.
GUI.traitsTab.EXPCurvesPanel.strongLegendariesSlowRadioButton.text=Strong Legendaries: Slow
GUI.traitsTab.EXPCurvesPanel.strongLegendariesSlowRadioButton.toolTipText=<html>\
  Strong legendaries get the "Slow" EXP Curve.<br />\
  This includes all legendaries with >600 BST.

#endregion

#region Given Pokemon tab
GUI.givenTab.title=Given Pokémon

#Starters panel
GUI.givenTab.startersPanel.title=Starter Pokémon
GUI.givenTab.startersPanel.unchangedRadioButton.text=Unchanged
GUI.givenTab.startersPanel.unchangedRadioButton.toolTipText=Don't change the starter Pokémon.
GUI.givenTab.startersPanel.customRadioButton.text=Custom
GUI.givenTab.startersPanel.customRadioButton.toolTipText=<html>\
  Lets you choose specific Pokémon species to use as the game's starters.<br />\
  You can also choose "Random" at the top of the selector.<br />\
  In games that have multiple sets of starters (Generation 6) [TODO: find and describe behaviour]
#TODO: find and describe behaviour
GUI.givenTab.startersPanel.randomRadioButton.text=Random
GUI.givenTab.startersPanel.randomRadioButton.toolTipText=<html>\
  Picks a random set of species to be used as the game's starters.<br />\
  These can be any species, unless other restrictions are set.
GUI.givenTab.startersPanel.BSTLimitsLabel.text=Limit Base Stat Totals:
GUI.givenTab.startersPanel.BSTLimitsLabel.toolTipText=<html>\
  If the boxes below are checked, all chosen starter Pokemon will be of species \
  that have a base stat total above the minimum and below the maximum entered below.<br />\
  For reference, all starter Pokémon (excepting Pikachu and Eevee) in the original games \
  are in the BST range 307-320 (249-253 in Generation 1).
GUI.givenTab.startersPanel.BSTMinimumCheckbox.text=Minimum
GUI.givenTab.startersPanel.BSTMinimumCheckbox.toolTipText=<html>\
  If checked, no Pokémon species will be chosen as a starter if it has a base stat total lower than the number below \
  (it can be chosen if its BST equals the number selected).<br />\
  For reference, the lowest base stat total any starter (except Pikachu) in the base games has is 307 (249 in Gen 1).
GUI.givenTab.startersPanel.BSTMinimumSpinner.toolTipText=<html>\
  The lowest base stat total a chosen starter's species may have (inclusive).<br />\
  For reference, the lowest base stat total any starter (except Pikachu) in the base games has is 307 (249 in Gen 1).
GUI.givenTab.startersPanel.BSTMaximumCheckbox.text=Maximum
GUI.givenTab.startersPanel.BSTMaximumCheckbox.toolTipText=<html>\
  If checked, no Pokémon will be chosen as a starter if it has a base stat total higher than the number below \
  (it can be chosen if its BST equals the number selected).<br />\
  For reference, the highest BST any starter (excluding Eevee) in the base games has is 320 (253 in Generation 1).
GUI.givenTab.startersPanel.BSTMaximumSpinner.toolTipText=<html>\
  The highest base stat total a chosen starter's species may have (inclusive).<br />\
  For reference, the highest BST any starter (excluding Eevee) in the base games has is 320 (253 in Generation 1).
GUI.givenTab.startersPanel.noLegendariesCheckBox.text=Don't Use Legendaries
GUI.givenTab.startersPanel.noLegendariesCheckBox.toolTipText=<html>\
  If selected, no legendary Pokémon species will be chosen as a starter.
GUI.givenTab.startersPanel.randomizeHeldItemsCheckBox.text=Randomize Held Items
GUI.givenTab.startersPanel.randomizeHeldItemsCheckBox.toolTipText=<html>\
  Checking this will randomize the items held by the starters where possible.<br />\
  In Generation 2 games, each starter will get an individual random item.<br />\
  In Generation 3 games, all the starters will get the same random item.
#TODO: determine and describe behaviour for other games
GUI.givenTab.startersPanel.banMinorItemsCheckBox.text=Ban Minor Items
GUI.givenTab.startersPanel.banMinorItemsCheckBox.toolTipText=<html>\
  Checking this will remove items that don't do much from the set of possible random items for starter Pokémon, \
  such as berries and mail.
GUI.givenTab.startersPanel.allowAltFormesCheckBox.text=Allow Alternate Formes
GUI.givenTab.startersPanel.allowAltFormesCheckBox.toolTipText=<html>\
  Allow alternate formes of Pokémon species, such as the various formes of Rotom or Deoxys, to appear as Starter \
  Pokémon.<br />\
  Note that any randomized traits are randomized separately from their base formes.
#Evolutions panel
GUI.givenTab.startersPanel.evolutionPanel=Evolution Restrictions
GUI.givenTab.startersPanel.evolutionPanel.basicOnlyCheckBox.text=Basic Pokémon Only
GUI.givenTab.startersPanel.evolutionPanel.basicOnlyCheckBox.toolTipText=<html>\
  If this is checked, all species chosen will be basic Pokémon, i.e., species that no other species evolves into.
GUI.givenTab.startersPanel.evolutionPanel.hasEvolutionsCheckBox.text=Has evolutions:
GUI.givenTab.startersPanel.evolutionPanel.hasEvolutionsCheckBox.toolTipText=<html>\
  If this is checked, only Pokémon species that can evolve at least the chosen number of times will be chosen.
GUI.givenTab.startersPanel.evolutionPanel.hasEvolutionCountSlider.toolTipText=<html>\
   A species must be able to evolve at least this many times in order to be randomly chosen as a starter.
#Types panel
GUI.givenTab.startersPanel.typesPanel.title=Type Restrictions
GUI.givenTab.startersPanel.typesPanel.noneRadioButton.text=None
GUI.givenTab.startersPanel.typesPanel.noneRadioButton.toolTipText=<html>\
  No restrictions will be applied to the types of starter Pokémon species (unless No Dual Types is checked).
GUI.givenTab.startersPanel.typesPanel.fireWaterGrassRadioButton.text=Fire, Water, Grass
GUI.givenTab.startersPanel.typesPanel.fireWaterGrassRadioButton.toolTipText=<html>\
  The starters chosen will be of the types Fire, Water, and Grass.<br />\
  They may also have other types.
GUI.givenTab.startersPanel.typesPanel.typeTriangleRadioButton.text=Any Type Triangle
GUI.givenTab.startersPanel.typesPanel.typeTriangleRadioButton.toolTipText=<html>\
  Chooses any three types that form a triangle of super-effective attacks.<br />\
  Does not guarantee resistances in the other direction.<br />\
  If allowing dual types, does not guarantee that second types will not break the triangle.
GUI.givenTab.startersPanel.typesPanel.singleTypeRadioButton.text=Single Type:
GUI.givenTab.startersPanel.typesPanel.singleTypeRadioButton.toolTipText=<html>\
  All randomly-chosen starters will be of the selected type.<br />\
  If set to "Random", a single type will be chosen and all randomly-chosen starters will be of that type.<br /><br />\
  <b>Warning:</b> This setting may cause the randomization to fail when used with others restricting which Pokémon may \
  be chosen, due to a lack of Pokémon species fulfilling the criteria.<br />\
  E.g. choosing "Has 2 Evolutions" and "Fighting" as the type will cause a failed randomization in \
  all generations, as Machop and Timburr are the only Fighting Pokémon with 2 evolutions.<br />\
  Earlier generations have similar issues with many other types.\
  "Basic Pokémon Only", "No Dual Types", "No Legendaries" etc. may also cause failures.<br /><br />\
  When Pokémon types are not randomized, it is possible for the user to figure out which combination of \
  options may work or not<br />\
  (e.g. in Gen 1, there will never be any non-dual type Ghost Pokémon, and Gen 4 is the first generation with 3 basic \
  non-legendary Dragon Pokémon).<br />\
  If Pokémon types are randomized, failing is more purely probabilistic. \
  As a rule, later generations have more species and are thus less likely to fail.
GUI.givenTab.startersPanel.typesPanel.noDualTypesCheckBox.text=No Dual Types
GUI.givenTab.startersPanel.typesPanel.noDualTypesCheckBox.toolTipText=<html>\
  Guarantees that the Pokémon species chosen will not be dual-types.<br />\
  They may still evolve into dual-types.
GUI.givenTab.startersPanel.typesPanel.uniqueTypeRadioButton.text=Unique
GUI.givenTab.startersPanel.typesPanel.uniqueTypeRadioButton.toolTipText=<html>\
  Randomly-chosen starters will not share types with others in their trio.

#Trades panel
GUI.givenTab.tradesPanel.title=In-Game Trades
GUI.givenTab.tradesPanel.randomizeGivenCheckBox.text=Randomize Given Species
GUI.givenTab.tradesPanel.randomizeGivenCheckBox.toolTipText=<html>\
  Selecting this will randomize the species of the Pokémon you receive from each in-game trade.
GUI.givenTab.tradesPanel.randomizeRequestedCheckBox.text=Randomize Requested Species
GUI.givenTab.tradesPanel.randomizeRequestedCheckBox.toolTipText=<html>\
  Selecting this will randomize the Pokémon species required to do each in-game trade.
GUI.givenTab.tradesPanel.randomizeNicknamesCheckBox.text=Randomize Nicknames
GUI.givenTab.tradesPanel.randomizeNicknamesCheckBox.toolTipText=<html>\
  Check this to randomize the nicknames of the Pokémon you receive.<br />\
  The nicknames will be chosen from a predefined list.<br />\
  If there are no more usable nicknames the original nicknames will be kept for the rest of the trades.
GUI.givenTab.tradesPanel.randomizeOTsCheckBox.text=Randomize OTs
GUI.givenTab.tradesPanel.randomizeOTsCheckBox.toolTipText=<html>\
  Check this to randomize the Original Trainer (ID & name) of the Pokémon you receive from trades.<br />\
  The names will be chosen from the same list as trainer names,<br />\
  with names that are too long to be OT names excluded.
GUI.givenTab.tradesPanel.randomizeIVsCheckBox.text=Randomize IVs
GUI.givenTab.tradesPanel.randomizeIVsCheckBox.toolTipText=<html>\
  Check this to randomize the IVs of the Pokémon you receive from ingame trades.<br />\
  In most games these Pokémon have set IVs, so clicking this randomizes those set IVs.
GUI.givenTab.tradesPanel.randomizeItemsCheckBox.text=Randomize Items
GUI.givenTab.tradesPanel.randomizeItemsCheckBox.toolTipText=<html>\
  Check this to give each Pokémon you receive from an ingame trade a random held item.<br />\
  This includes trades that do not normally have a held item on the Pokémon.

#endregion

#region Moves tab
GUI.movesTab.title=Moves & Movesets

#Move Traits panel
GUI.movesTab.traitsPanel.title=Move Traits
GUI.movesTab.traitsPanel.randomizePowerCheckBox.text=Randomize Move Power
GUI.movesTab.traitsPanel.randomizePowerCheckBox.toolTipText=<html>\
  Randomize the power of normal damaging moves.<br />\
  Moves will get a new random power generally between 20 and 150 inclusive, with a very small chance \
  of higher values appearing.<br />\
  Non-damaging moves and moves with variable power will be unaffected.<br />\
  <b>NOTE: There is no way to see the updated power of moves in-game in Gen 1!</b>
GUI.movesTab.traitsPanel.randomizeAccuracyCheckBox.text=Randomize Move Accuracy
GUI.movesTab.traitsPanel.randomizeAccuracyCheckBox.toolTipText=<html>\
  Randomize the accuracy of most moves.<br />\
  Some restrictions are enforced to reduce the chances of situations like 100% accurate OHKO moves happening.<br />\
  Sure-hit moves are not changed.<br />\
  <b>NOTE: There is no way to see the updated accuracy of moves in-game in Gen 1!</b>
GUI.movesTab.traitsPanel.randomizePPCheckBox.text=Randomize Move PP
GUI.movesTab.traitsPanel.randomizePPCheckBox.toolTipText=<html>\
  Randomize the PP of each move.<br />\
  The maximum PP of each move (before PP Ups) will be randomized to a multiple of 5 between 5 and 40 inclusive.
GUI.movesTab.traitsPanel.randomizeTypesCheckBox.text=Randomize Move Types
GUI.movesTab.traitsPanel.randomizeTypesCheckBox.toolTipText=<html>\
  Randomize the type of most moves.<br />\
  The type of each move other than Struggle and ???-type moves will be re-rolled randomly.<br />\
  This has no real effect on self-status moves, and may have odd side effects in Gen 1.
GUI.movesTab.traitsPanel.randomizeNamesCheckBox.text=Randomize Move Names
GUI.movesTab.traitsPanel.randomizeNamesCheckBox.toolTipText=<html>\
  Randomize names of moves.<br />\
  The name chosen will be based off the Type of the move.<br />\
  If Randomized Move Types are on, then the name will be based on the randomized type.<br />\
  <b>NOTE: This feature is only available for English-language games.</b>
GUI.movesTab.traitsPanel.randomizeDamageCategoryCheckBox.text=Randomize Damaging Move Categories
GUI.movesTab.traitsPanel.randomizeDamageCategoryCheckBox.toolTipText=<html>\
  Randomize the category of damaging moves between Physical and Special.<br />\
  This does not affect status moves.<br />\
  <b>NOTE: This feature is not available for Gen 1-3 games. \
  This randomizer does NOT add the Physical/Special split to games that don't have it!</b>
GUI.movesTab.traitsPanel.updateMovesCheckBox.text=Update Moves to Generation:
GUI.movesTab.traitsPanel.updateMovesCheckBox.toolTipText=<html>\
  If this is checked, moves will be updated to their stats (power, accuracy, etc) in \
  the generation chosen to the right where possible.<br />\
  <b>This does NOT add the Fairy type! Moves that were changed to Fairy type will keep their Gen 5 types.</b><br />\
  Note that this only affects move stats, not any secondary effects that may have been added.

#Movesets panel
GUI.movesTab.movesetsPanel.title=Species Learned Movesets
GUI.movesTab.movesetsPanel.unchangedRadioButton.text=Unchanged
GUI.movesTab.movesetsPanel.unchangedRadioButton.toolTipText=Don't change Pokémon species' learned movesets at all.
GUI.movesTab.movesetsPanel.randomPreferringSameTypeRadioButton.text=Random (preferring same type)
GUI.movesTab.movesetsPanel.randomPreferringSameTypeRadioButton.toolTipText=<html>\
  Randomize Pokémon movesets, preferring moves that are of the type (or one of the types) of the Pokémon.<br />\
  Each Pokémon will get at least one reasonably accurate damaging move to begin with.
GUI.movesTab.movesetsPanel.randomCompletelyRadioButton.text=Random (completely)
GUI.movesTab.movesetsPanel.randomCompletelyRadioButton.toolTipText=<html>\
  Randomize Pokémon movesets, completely ignoring the type of the move and the Pokémon.<br />\
  Each Pokémon will get at least one reasonably accurate damaging move to begin with.
GUI.movesTab.movesetsPanel.metronomeOnlyModeRadioButton.text=Metronome Only Mode
GUI.movesTab.movesetsPanel.metronomeOnlyModeRadioButton.toolTipText=<html>\
  Where possible, every Pokémon in the entire game will have Metronome as its only move,<br />\
  with the PP boosted to 40 to make it possible to complete fights without always using Struggle.<br />\
  Does not currently apply to non-standard battles such as the Battle Tower/Frontier or the PWT.
GUI.movesTab.movesetsPanel.guaranteedLevel1MovesCheckBox.text=Guaranteed Level 1 Moves
GUI.movesTab.movesetsPanel.guaranteedLevel1MovesCheckBox.toolTipText=<html>\
  Check this to make sure every Pokémon gets a guaranteed amount of moves at level 1, \
  instead of them keeping their original move count.<br />\
  Set amount of guaranteed moves with the slider to the right.<br />\
  Setting this to 4 ensures that every Pokémon you catch will have a full moveset.
GUI.movesTab.movesetsPanel.guaranteedLevel1MovesSlider.toolTipText=<html>\
  Set amount of guaranteed moves at level 1. Applies to all Pokémon.
GUI.movesTab.movesetsPanel.reorderDamagingMovesCheckBox.text=Reorder Damaging Moves
GUI.movesTab.movesetsPanel.reorderDamagingMovesCheckBox.toolTipText=<html>\
  Reorders the randomized movesets so that less powerful damaging moves are learnt before those with high power.<br />\
  The positions of non-damaging moves will not change.
GUI.movesTab.movesetsPanel.noGameBreakingMovesCheckBox.text=No Game-Breaking Moves
GUI.movesTab.movesetsPanel.noGameBreakingMovesCheckBox.toolTipText=<html>\
  Checking this checkbox will stop moves that can break early/late games being available in randomized movesets.<br />\
  In first generation games, Dragon Rage, SonicBoom, Spore, and every OHKO move are banned.<br />\
  In second generation onwards, only SonicBoom and Dragon Rage are banned \
  (because OHKO moves and sleep are significantly less broken).
GUI.movesTab.movesetsPanel.forceGoodDamagingCheckBox.text=Force % of Good Damaging Moves:
GUI.movesTab.movesetsPanel.forceGoodDamagingCheckBox.toolTipText=<html>\
  Selecting this option will allow you to use the slider below to select a proportion of \
  the randomized movesets to be forced to be good damaging moves.<br />\
  Note that other moves can still be selected as good damaging moves randomly, this is simply an additional chance.
GUI.movesTab.movesetsPanel.forceGoodDamagingSpinSlider.toolTipText=<html>\
  Use this %s to select the probability of good damaging moves for the option above.<br />\
  Note that other moves can still be selected as good damaging moves randomly, this is simply an additional chance.
GUI.movesTab.movesetsPanel.evolutionMovesCheckBox.text=Evolution Moves for All Pokémon
GUI.movesTab.movesetsPanel.evolutionMovesCheckBox.toolTipText=<html>\
  Selecting this option will cause every Pokémon to learn a move upon evolution.<br /><br />\
  <b>Use carefully with Sun/Moon 1.0 - </b>due to a glitch, if a Pokémon has an evolution move \
  and also learns a move<br />\
  on the level that it evolved at, it will only learn the evolution move upon evolving.

#endregion

#region Foe Pokemon tab
GUI.foeTab.title=Foe Pokémon

#Trainer Pokemon panel
GUI.foeTab.trainersPanel.title=Trainer Pokémon
GUI.foeTab.trainersPanel.randomizeCheckBox.text=Randomize Trainers' Pokémon
GUI.foeTab.trainersPanel.randomizeCheckBox.toolTipText=Whether to randomize the species of trainers' existing Pokémon.
#Boss-Important-Regular columns
GUI.foeTab.trainersPanel.addMorePokemonForLabel.text=Additional Pokémon for...
GUI.foeTab.trainersPanel.addPokemonToBossTrainersCheckBox.text=Boss Trainers
GUI.foeTab.trainersPanel.addPokemonToBossTrainersCheckBox.toolTipText=<html>\
  Check this to add additional Pokémon to "Boss" Trainers (select amount of new Pokémon below). \
  Trainers will not get more than 6 total Pokémon.<br />\
  Boss Trainers include Gym Leaders, Kahunas, Team Leaders, Elite Four, and Champions.
GUI.foeTab.trainersPanel.addPokemonToImportantTrainersCheckBox.text=Important Trainers
GUI.foeTab.trainersPanel.addPokemonToImportantTrainersCheckBox.toolTipText=<html>\
  Check this to add additional Pokémon to "Important" Trainers (select amount of new Pokémon below). \
  Trainers will not get more than 6 total Pokémon.<br />\
  Important Trainers include Rivals/Friends, Team Admins, and other important story battles \
  (such as Colress in BW2 and Sycamore in XY).
GUI.foeTab.trainersPanel.addPokemonToRegularTrainersCheckBox.text=Regular Trainers
GUI.foeTab.trainersPanel.addPokemonToRegularTrainersCheckBox.toolTipText=<html>\
  Check this to add additional Pokémon to regular Trainers (select amount of new Pokémon below). \
  Trainers will not get more than 6 total Pokémon.<br />\
  Regular Trainers include all trainers that don't qualify as "Boss" or "Important" Trainers.
GUI.foeTab.trainersPanel.betterMovesetsLabel=Better Movesets for...
GUI.foeTab.trainersPanel.betterMovesetsBossTrainersCheckBox.text=Boss Trainers
GUI.foeTab.trainersPanel.betterMovesetsBossTrainersCheckBox.toolTipText=<html>\
  Check this to give "Boss" trainers better movesets by including \
  TM moves/tutor moves/egg moves/pre-evolution moves,<br />\
  and picking moves that synergize with the Pokémon's ability/stats/other moves.
GUI.foeTab.trainersPanel.betterMovesetsImportantTrainersCheckBox.text=Important Trainers
GUI.foeTab.trainersPanel.betterMovesetsImportantTrainersCheckBox.toolTipText=<html>\
  Check this to give "Important" trainers better movesets by including \
  TM moves/tutor moves/egg moves/pre-evolution moves,<br />\
  and picking moves that synergize with the Pokémon's ability/stats/other moves.
GUI.foeTab.trainersPanel.betterMovesetsRegularTrainersCheckBox.text=Regular Trainers
GUI.foeTab.trainersPanel.betterMovesetsRegularTrainersCheckBox.toolTipText=<html>\
  Check this to give regular trainers better movesets by including \
  TM moves/tutor moves/egg moves/pre-evolution moves,<br />\
  and picking moves that synergize with the Pokémon's ability/stats/other moves.
GUI.foeTab.trainersPanel.heldItemsLabel.text=Add Held Items to...
GUI.foeTab.trainersPanel.heldItemsBossTrainersCheckBox.text=Boss Trainers
GUI.foeTab.trainersPanel.heldItemsBossTrainersCheckBox.toolTipText=<html>\
  Check this to add or replace held items for the Pokémon of "Boss" Trainers.<br />\
  Boss Trainers include Gym Leaders, Kahunas, Team Leaders, Elite Four, and Champions.
GUI.foeTab.trainersPanel.heldItemsImportantTrainersCheckBox.text=Important Trainers
GUI.foeTab.trainersPanel.heldItemsImportantTrainersCheckBox.toolTipText=<html>\
  Check this to add or replace held items for the Pokémon of "Important" Trainers.<br />\
  Important Trainers include Rivals/Friends, Team Admins, and other important story battles \
  (such as Colress in BW2 and Sycamore in XY).
GUI.foeTab.trainersPanel.heldItemsRegularTrainersCheckBox.text=Regular Trainers
GUI.foeTab.trainersPanel.heldItemsRegularTrainersCheckBox.toolTipText=<html>\
  Check this to add or replace held items for the Pokémon of regular Trainers.<br />\
  Regular Trainers include all trainers that don't qualify as "Boss" or "Important" Trainers.
GUI.foeTab.trainersPanel.heldItemsConsumableOnlyCheckBox.text=Consumable Only
GUI.foeTab.trainersPanel.heldItemsConsumableOnlyCheckBox.tooltip=<html>\
  Items will be chosen randomly from all single-use held items that a Pokémon can eat/use on its own.<br />\
  This is mostly berries, with a few other items like Focus Sash and White Herb.</html>
GUI.foeTab.trainersPanel.heldItemsSensibleCheckBox.text=Sensible Items
GUI.foeTab.trainersPanel.heldItemsSensibleCheckBox.tooltip=<html>\
  Items will be chosen randomly from a subset of the held items that "make sense" for a given Pokémon.<br />\
  For example, Silk Scarf won't be an option for a given Pokémon unless it knows at least one \
  damaging normal move.<br />\
  Another example is that a Yache berry will only be an option on Pokémon that are weak or double weak to Ice.</html>
GUI.foeTab.trainersPanel.heldItemsAceOnlyCheckBox.text=Highest Level Only
GUI.foeTab.trainersPanel.heldItemsAceOnlyCheckBox.tooltip=<html>\
  If this option is selected, a held item will be given only to a trainer's highest level \
  Pokémon (or one of them, if there are multiple at that level).<br />\
  If this is unchecked, all of a Trainer's Pokémon will be given items.</html>
GUI.foeTab.trainersPanel.typeDiversityLabel.text=Force Diverse Types for...
GUI.foeTab.trainersPanel.typeDiversityBossTrainersCheckBox.text=Boss Trainers
GUI.foeTab.trainersPanel.typeDiversityBossTrainersCheckBox.toolTipText=<html>\
  Check this to ensure that "Boss" trainers do not use multiple Pokémon of the same type.<br />\
  If the trainer has a type theme, this option will be ignored.<br />\
  If 'Additional Pokémon for Boss Trainers' is selected but Trainer Pokémon are 'Unchanged', \
  only the added Pokémon are guaranteed diverse types.<br /><br />\
  Boss Trainers include Gym Leaders, Kahunas, Team Leaders, Elite Four, and Champions.
GUI.foeTab.trainersPanel.typeDiversityImportantTrainersCheckBox.text=Important Trainers
GUI.foeTab.trainersPanel.typeDiversityImportantTrainersCheckBox.toolTipText=<html>\
  Check this to ensure that "Important" trainers do not use multiple Pokémon of the same type.<br />\
  If the trainer has a type theme, this option will be ignored.<br />\
  If 'Additional Pokémon for Important Trainers' is selected but Trainer Pokémon are 'Unchanged', \
  only the added Pokémon are guaranteed diverse types.<br /><br />\
  Important Trainers include Rivals/Friends, Team Admins, and other important story battles \
  (such as Colress in BW2 and Sycamore in XY).
GUI.foeTab.trainersPanel.typeDiversityRegularTrainersCheckBox.text=Regular Trainers
GUI.foeTab.trainersPanel.typeDiversityRegularTrainersCheckBox.toolTipText=<html>\
  Check this to ensure that regular trainers do not use multiple Pokémon of the same type.<br />\
  If the trainer has a type theme, this option will be ignored.<br />\
  If 'Additional Pokémon for Regular Trainers' is selected but Trainer Pokémon are 'Unchanged', \
  only the added Pokémon are guaranteed diverse types.<br /><br />\
  Regular Trainers include all trainers that don't qualify as "Boss" or "Important" Trainers.
#General settings column
GUI.foeTab.trainersPanel.avoidDuplicatesCheckBox.text=Try to Avoid Duplicate Species
GUI.foeTab.trainersPanel.avoidDuplicatesCheckBox.toolTipText=<html>\
  If this is checked, any randomly chosen Pokémon for a given trainer will be a different species \
  from the trainer's other Pokémon.<br />\
  However, if other rules restrict the set of allowed Pokémon too much, duplicates are possible.
GUI.foeTab.trainersPanel.rivalCarriesStarterCheckBox.text=Rival Carries Starter Through Game
GUI.foeTab.trainersPanel.rivalCarriesStarterCheckBox.toolTipText=<html>\
  If this is selected, the rival(s) will have their starter in every team they battle you with, \
  evolved if it is far enough through.<br />\
  The rest of their team will be chosen in the same way as every other trainer.
GUI.foeTab.trainersPanel.useLocalPokemon.text=Use Local Pokémon Species
GUI.foeTab.trainersPanel.useLocalPokemon.toolTipText=<html>\
  Trainers use only Pokémon species that can be found in the wild during the main game (i.e., pre-Elite Four)\
  and their evolutionary relatives.<br />\
  DexNav Foreign Encounters do not count as local even though they can be encountered during the main game.<br />\
  If used with "Pokémon League has Unique Pokémon", those Pokémon are instead chosen from the set of non-local Pokémon.
GUI.foeTab.trainersPanel.noLegendariesCheckBox.text=Don't Use Legendaries
GUI.foeTab.trainersPanel.noLegendariesCheckBox.toolTipText=<html>\
  If this is selected, no randomly-chosen trainer Pokémon will be a legendary species.
GUI.foeTab.trainersPanel.noEarlyWonderGuardCheckBox.text=No Early Wonder Guard
GUI.foeTab.trainersPanel.noEarlyWonderGuardCheckBox.toolTipText=<html>\
  If this is selected, Pokémon of species that have the ability "Wonder Guard" will not appear below level 20.
GUI.foeTab.trainersPanel.allowAlternateFormesCheckBox.text=Allow Alternate Formes
GUI.foeTab.trainersPanel.allowAlternateFormesCheckBox.toolTipText=<html>\
  Allow trainers to have alternate formes of Pokémon, such as the various formes of Rotom or Deoxys.<br />\
  Note that their traits are randomized/shuffled separately from their base formes.
GUI.foeTab.trainersPanel.swapMegaEvosCheckBox.text=Swap Mega Evolvables
GUI.foeTab.trainersPanel.swapMegaEvosCheckBox.toolTipText=<html>\
  Swap Trainer Pokémon capable of Mega Evolution with another Pokémon capable of Mega Evolution.<br />\
  This only affects Trainer Pokémon that actually hold a Mega Stone \
  (so, for example, it will affect Diantha's Gardevoir but not every Gardevoir).<br />\
  If the "Limit Pokémon" general option is used to remove all Mega Evolutions \
  from the game, this setting will be disabled.
GUI.foeTab.trainersPanel.similarStrengthCheckBox.text=Try to Use Pokémon with Similar Strength
GUI.foeTab.trainersPanel.similarStrengthCheckBox.toolTipText=<html>\
  If this is checked, the random Pokémon species that replaces each Pokémon will have a similar base stat total \
  to the original.<br />\
  However, preserving other rules such as type theming or avoiding duplicates has precedence over this, \
  so weaker or stronger species will be chosen if there are no other species available.
GUI.foeTab.trainersPanel.distributeSpeciesCheckBox.text=Distribute Species Evenly
GUI.foeTab.trainersPanel.distributeSpeciesCheckBox.toolTipText=<html>\
  For all trainers in the game (main-game and post-game), attempt to distribute Pokémon species evenly.<br />\
  Any other modifiers like similar strength take precedence.
GUI.foeTab.trainersPanel.distributeInMainGameOnlyCheckBox.text=Main Game Only
GUI.foeTab.trainersPanel.distributeInMainGameOnlyCheckBox.toolTipText=<html>\
  When attempting to distribute species evenly, ignores post-game trainers \
  (their Pokémon are assigned ignoring distribution).<br />\
  This should allow for more even distribution among the main-game trainers.<br />\
  Currently only available for Generation 5.
GUI.foeTab.trainersPanel.randomShiniesCheckBox.text=Random Shiny Trainer Pokémon
GUI.foeTab.trainersPanel.randomShiniesCheckBox.toolTipText=<html>\
  If this is selected, each randomly-chosen trainer Pokémon will have a 1/256 chance of being shiny.
#Settings with quantities column
GUI.foeTab.trainersPanel.eliteFourUniquePokemonCheckBox.text=Pokémon League Has Unique Pokémon:
GUI.foeTab.trainersPanel.eliteFourUniquePokemonCheckBox.toolTipText=<html>\
  Enabling this setting will ensure that Pokémon League Trainers (Elite Four, Champions and BW1 N/Ghetsis) <br />\
  are given the specified number of unique Pokémon species that will not appear on any other Trainer.<br />\
  The Elite Four Trainers' highest level Pokémon are the ones that will be unique;<br/>\
  in the case of a level tie, it will be the Pokémon further back in the party.<br />\
  Does not apply to postgame Pokémon League battles.<br /><br />\
  If used with "Use Local Pokémon", the unique Pokémon will be non-local species if possible.
GUI.foeTab.trainersPanel.trainersEvolveTheirPokemonCheckbox.text=Trainers Evolve their Pokémon
GUI.foeTab.trainersPanel.trainersEvolveTheirPokemonCheckbox.toolTipText=<html>\
  Checking this will guarantee that any trainer Pokémon is evolved as far as possible at its level.<br />\
  For any Pokémon that does not evolve by level up, its Estimated Evolution Level is used \
  which is deduced from all level up evolutions.
GUI.foeTab.trainersPanel.PercentageEvolutionLevelModifierSpinSlider.toolTipText=<html>\
  Use this %s to select the percentage to scale trainer Pokémon evolution levels by.<br />\
  Negative percentages (-100 to 0) will decrease the levels at which trainer Pokémon evolve, \
  making battles harder.<br />\
  Positive percentages will increase the levels at which trainer Pokémon evolve, making battles easier.<br />\
  Estimated Evolution Levels of Pokémon are scaled by the value selected as well.<br />\
  Note that the minimal possible level is 1 and the maximal possible level is 100.
GUI.foeTab.trainersPanel.calculatedFullyEvolvedLvlLabel.text=Latest Fully Evolved Level: %s
GUI.foeTab.trainersPanel.calculatedFullyEvolvedLvlLabel.toolTipText=<html>\
  Displays the level at which all trainer Pokémon will be fully evolved if \
  'Trainers Evolve their Pokémon' is selected.<br/>\
  The displayed level will change based on the percentage chosen for scaling trainer Pokémon evolution levels above \
  as well as the level chosen for 'Make Evolutions Easier' if that option is selected.
GUI.foeTab.trainersPanel.percentageLevelModifierCheckBox.text=Change Trainer Pokémon Levels:
GUI.foeTab.trainersPanel.percentageLevelModifierCheckBox.toolTipText=<html>\
  Checking this will change the level of every enemy trainer Pokémon in the game by the percentage selected below.
GUI.foeTab.trainersPanel.percentageLevelModifierSpinSlider.toolTipText=<html>\
  Use this %s to select the percentage to change trainer Pokémon levels by.<br />\
  Negative percentages (-100 to 0) will decrease levels, making battles easier;<br />\
  positive percentages will increase levels, making battles harder.<br />\
  Note that the minimal possible level is 1 and the maximal possible level is 100.
#Battle Style panel
GUI.foeTab.trainersPanel.battleStylePanel.title=Battle Style
GUI.foeTab.trainersPanel.battleStylePanel.unchangedRadioButton.text=Unchanged
GUI.foeTab.trainersPanel.battleStylePanel.unchangedRadioButton.toolTipText=Don't change the Trainer's battle style at all.
GUI.foeTab.trainersPanel.battleStylePanel.randomRadioButton.text=Random
GUI.foeTab.trainersPanel.battleStylePanel.randomRadioButton.toolTipText=<html>\
  Sets all Trainer battles to a random battle style out of those not excluded to the right. The first rival battle is \
  excluded.<br />\
  Other trainers with only one or two Pokémon will be unable to roll anything above Single or Double Battles \
  respectively, unless the "Extend Teams" checkbox is checked.<br />\
  If all but one battle style is selected, all trainers will have that style (except those that cannot roll it, \
  if applicable).<br /><br />\
  <b>Be aware that there are a few issues with this.</b> In particular:<ul>\
  <li>Entering a multi-battle with not enough Pokémon causes some generation-dependent issues:<ul>\
  <li>Gen 3: The empty spot will be filled by a duplicate of the single Pokémon, and entering the "Pokémon" \
  menu will softlock the game.</li>\
  <li>Gen 4: The empty spot will be filled by a garbled sprite that only can use Struggle.</li>\
  <li>Gen 6/7: The empty spot will be filled by a shiny Bulbasaur that cannot act.</li></ul></li>\
  <li>In Gen 5 games, Trainer pairs that are double battles in the regular game will have one incorrect text box \
  if you let them spot you.</li>\
  <li>In Gen 6 games, regular Trainers will have some text issues if you talk to them directly.</li></ul></html>
GUI.foeTab.trainersPanel.battleStylePanel.extendTeamsCheckBox=Extend Teams
GUI.foeTab.trainersPanel.battleStylePanel.extendTeamsCheckBox.toolTipText=<html>\
  If selected, trainers with fewer Pokémon than their randomly-chosen battle style requires (two for Double Battle, \
  three for Triple and Rotation battles)<br />\
  will have their team extended to match (adding duplicates of their highest-level Pokémon, \
  randomized separately if trainer Pokémon are randomized).<br /><br />\
  If this is <b>not</b> selected, a trainer will never be assigned a battle style which they do not have enough \
  Pokémon for.<br />\
  If all styles that they have enough Pokémon for are excluded, they will be assigned the style they qualify for \
  that requires the most Pokémon<br />\
  (Double Battle if they have two Pokémon, Single Battle otherwise).
GUI.foeTab.trainersPanel.battleStylePanel.excludeLabel=Exclude...
GUI.foeTab.trainersPanel.battleStylePanel.excludeSingleCheckBox.text=Single Battles
GUI.foeTab.trainersPanel.battleStylePanel.excludeSingleCheckBox.toolTipText=<html>\
  If selected, no trainers will be randomly selected to use the Single Battle style.<br />\
  Note that trainers with only one Pokémon will still use Single Battles unless the "Extend Teams" checkbox is set.
GUI.foeTab.trainersPanel.battleStylePanel.excludeDoubleCheckBox.text=Double Battles
GUI.foeTab.trainersPanel.battleStylePanel.excludeDoubleCheckBox.toolTipText=<html>\
  If selected, no trainers will be randomly selected to use the Double Battle style.<br />\
  Note that, if Single Battles are excluded, trainers with only two Pokémon will still use Double Battles \
  unless the "Extend Teams" checkbox is set.
GUI.foeTab.trainersPanel.battleStylePanel.excludeTripleCheckBox.text=Triple Battles
GUI.foeTab.trainersPanel.battleStylePanel.excludeTripleCheckBox.toolTipText=<html>\
  If selected, no trainers will use the Triple Battle style.
GUI.foeTab.trainersPanel.battleStylePanel.excludeRotationCheckBox.text=Rotation Battles
GUI.foeTab.trainersPanel.battleStylePanel.excludeRotationCheckBox.toolTipText=<html>\
  If selected, no trainers will use the Rotation Battle style.
#Types panel
GUI.foeTab.trainersPanel.typesPanel.title=Type Restrictions
GUI.foeTab.trainersPanel.typesPanel.noneRadioButton.text=None
GUI.foeTab.trainersPanel.typesPanel.noneRadioButton.toolTipText=Don't restrict the types of trainers' Pokémon.
GUI.foeTab.trainersPanel.typesPanel.randomThemesRadioButton.text=Random Type Themes
GUI.foeTab.trainersPanel.typesPanel.randomThemesRadioButton.toolTipText=<html>\
  Gives each trainer a random type theme. All of their randomly-chosen Pokémon will have that type.<br />\
  Certain groups of trainers, such as the trainers in each gym, will all be given the same (random) type.
GUI.foeTab.trainersPanel.typesPanel.keepThemesRadioButton.text=Keep Type Themes
GUI.foeTab.trainersPanel.typesPanel.keepThemesRadioButton.toolTipText=<html>\
  If a trainer originally had only Pokémon of a certain type, their randomly-chosen Pokémon will be that type.<br />\
  (Trainers with only one Pokémon are considered themed.)<br />\
  Gym trainers and Elite Four/Champions will be forced to their "official" type theme, \
  even if not all their Pokémon are that type.<br />\
  All other trainers will have no type restriction.
GUI.foeTab.trainersPanel.typesPanel.keepThemesOrPrimaryRadioButton.text=Keep Themes or Primary Type
GUI.foeTab.trainersPanel.typesPanel.keepThemesOrPrimaryRadioButton.toolTipText=<html>\
  If a trainer originally had only Pokémon of a certain type, their randomly-chosen Pokémon will be that type.<br />\
  (Trainers with only one Pokémon are considered themed.)<br />\
  Gym trainers and Elite Four/Champions will be forced to their "official" type theme, \
  even if not all their Pokémon are that type.<br />\
  Otherwise, for each Pokémon, replaces it with a Pokémon that shares its primary type.<br />\
  For example, a Grass-Poison type might be replaced with a pure Grass type, a Grass-Psychic type, or a Bug-Grass type.
GUI.foeTab.trainersPanel.typesPanel.gymsAndElitesOnlyCheckBox.text=Apply to Gym Trainers/Elite 4 Only
GUI.foeTab.trainersPanel.typesPanel.gymsAndElitesOnlyCheckBox.toolTipText=<html>\
  If this is checked, all type restrictions in this panel will be applied ONLY to Gym trainers and the Elite Four.<br />\
  All other trainers will have no type restrictions.
GUI.foeTab.trainersPanel.typesPanel.weightTypesCheckBox.text=Weight Types by # of Pokémon
GUI.foeTab.trainersPanel.typesPanel.weightTypesCheckBox.toolTipText=<html>\
  If this is checked, the number of trainers with each type will roughly \
  match up to the number of Pokémon with that type.<br />\
  This should reduce repetition of Pokémon, but may lead to a lot of trainers with the same types.

#endregion

CodeTweaks.unused8.name=ERROR: Unused 8
CodeTweaks.unused8.toolTipText=<html>This Misc. Tweak should not be visible.<br /> If you see this, consider making a bug report.

CodeTweaks.sosBattles.name=All Wild Pokémon Can Call Allies
CodeTweaks.sosBattles.toolTipText=<html>Makes it possible for every Pokémon to call allies during wild Pokémon battles.<br />Without this setting, only Pokémon that could call allies in the base game will be able to call allies.
GUI.stpPanel.title=Static Pokémon
GUI.stpUnchangedRadioButton.toolTipText=Static Pokémon remain the same.
GUI.stpUnchangedRadioButton.text=Unchanged
GUI.stpSwapLegendariesSwapStandardsRadioButton.toolTipText=<html>Selecting this will replace every static Pokémon encounter, gift or purchase with another random one.<br />In this particular mode, legendary pokemon will always be swapped for other legendaries.<br />Also, normal non-legendary Pokémon will only be swapped for other non-legendaries.<br />In games where Ultra Beasts appear, they will be swapped out for other Ultra Beasts.
GUI.stpSwapLegendariesSwapStandardsRadioButton.text=Swap Legendaries && Swap Standards
GUI.stpRandomCompletelyRadioButton.toolTipText=<html>Selecting this will replace every static Pokémon encounter, gift or purchase with another random one.<br />In this particular mode, any Pokémon can replace any other Pokémon, so you could get a Mew in the Game Corner.<br />Or fight Magikarp instead of Mewtwo...
GUI.stpRandomCompletelyRadioButton.text=Random (completely)
GUI.stpRandomSimilarStrengthRadioButton.toolTipText=<html>Selecting this will replace every static Pokémon encounter with a Pokémon of similar strength.
GUI.stpRandomSimilarStrengthRadioButton.text=Random (similar strength)
GUI.stpLimitMainGameLegendariesCheckBox.toolTipText=<html>Selecting this will prevent main-game Legendary Pokémon from being replaced by Pokémon with higher base stat totals.<br /><br />This only applies to main-game Legendary Pokémon that are catchable and that are directly in your way during the main game, so some Pokémon<br />like Kyurem-B/Kyurem-W in BW2 (not catchable) and Rayquaza in Emerald (have to go out of your way to catch) are not included.
GUI.stpLimitMainGameLegendariesCheckBox.text=Limit Main-Game Legendaries
GUI.stpRandomize600BSTCheckBox.toolTipText=<html>Selecting this will enforce pure random on all static Pokémon with 600+ BST.
GUI.stpRandomize600BSTCheckBox.text=Randomize 600+ BST

GUI.miscRandomizePCPotionCheckBox.toolTipText=<html>Selecting this option will randomize the Potion that is in your item PC at the beginning of the game to any other "useful" item.
GUI.miscRandomizePCPotionCheckBox.text=Randomize PC Potion
GUI.miscBanBigMoneyManiacCheckBox.text=Ban Big Money Maniac Items
GUI.miscBanBigMoneyManiacCheckBox.toolTipText=<html>Bans maniac items worth more than $10,000 from showing up as any kind of randomized item.

#TODO: remove
GenerationLimitDialog.title=Choose Pokémon to allow
GenerationLimitDialog.warningRomHackLabel.text=<html><center>WARNING: This functionality will NOT work correctly with ROM hacks<br /> that change the available Pokémon or add new ones!</center>
GenerationLimitDialog.warningXYLabel.text=<html><center>To prevent X/Y from softlocking, you must<br />select at least one of Generations 1, 2, 3, or 4</center>









GUI.wildPokemonPanel.title=Wild Pokémon
GUI.wpPanel.title=Wild Pokémon
GUI.wpRandomizeWildPokemonCheckBox.text=Randomize Wild Pokémon
GUI.wpRandomizeWildPokemonCheckBox.toolTipText=Whether to randomize wild Pokémon encounters.
GUI.wpZoneNoneRadioButton.text=Maximum Possible
GUI.wpZoneNoneRadioButton.toolTipText=<html>Place the maximum possible amount of different Pokémon encounters into each area.<br />This amount varies by game and area (higher in later generations), but is typically in the range 5-10 per encounter type.
GUI.wpZoneEncounterSetRadioButton.text=1 Per Encounter Set
GUI.wpZoneEncounterSetRadioButton.toolTipText=<html>Each Pokémon in a given encounter set will be replaced by another Pokémon in every slot it appears in.<br /> This will make each set have a handful of random Pokémon.<br /><br /> Each "set" is a smaller chunk of encounter data, e.g. different floors of the same dungeon or fishing/surfing on the same route,<br /> or encounters for morning/day/night or seasons if "Use Time Based Encounters" is selected, count as separate sets.<br /> Using this option they will be randomized separately.<br /><br /> Compare to "1 Per Location".
GUI.wpZoneMapRadioButton.text=1 Per Map
GUI.wpZoneMapRadioButton.toolTipText=<html>On each map, each Pokémon will be replaced by exactly one new Pokémon.<br />A map is the portion of a single named area that is loaded at one time, such as a route, a single floor of a cave or tower, etc.<br />Compare to "1 Per Location".<br /><br />In some games, there are encounter sets that are shared between multiple maps. These will be considered their own maps, but any that are<br /> shared between the same set of maps will be grouped into a single pseudo-map.
GUI.wpZoneLocationRadioButton.text=1 Per Named Location
GUI.wpZoneLocationRadioButton.toolTipText=<html>Each Pokémon in a given location will be replaced by another Pokémon in every slot it appears in.<br /> This will make each location have a handful of random Pokémon.<br /><br /> A location is essentially a named place on the town map, e.g. different floors of the same dungeon<br /> or fishing/surfing on the same route may count as separate maps or encounter sets, but they still fall under the same location.<br /> Using this option they will be randomized together.<br /><br /> Compare to "1 Per Encounter Set" or "1 Per Map".<br /><br /> Due to technical limitations, some locations may be unintuitive:<br /> In <b>Gen 1</b>, the old rod and good rod each constitute their own location.<br /> In <b>Gen 1, except Yellow</b>, super rod encounters may be shared by multiple routes/towns/dungeons and are categorized into "groups" by the game.<br /> Each of these "groups" is counted as a location. <br /> In <b>Gen 2</b>, fishing and headbutt encounters may be shared by multiple routes/towns/dungeons and are categorized into "groups" by the game.<br/ > Each of these "groups" is counted as a location. <br />
GUI.wpZoneGlobalRadioButton.text=1 In Whole Game
GUI.wpZoneGlobalRadioButton.toolTipText=<html>Every place a certain Pokémon appears in, it will be replaced by another set Pokémon.
GUI.wpERPanel.title=Evolution Restrictions
GUI.wpERNoneRadioButton.text=None
GUI.wpERBasicOnlyRadioButton.text=Only Basic Pokémon
GUI.wpERBasicOnlyRadioButton.toolTipText=<html>If selected, only Pokémon which no Pokémon can evolve into will be selected.<br /><br />If used with "Keep Relations", each evolutionary family chosen will begin with one such Pokémon.
GUI.wpERSameEvolutionStageRadioButton.text=Same Evolution Stage
GUI.wpERSameEvolutionStageRadioButton.toolTipText=<html>If selected, each randomly-chosen Pokémon will have the same evolutionary stage as the Pokémon it replaced,<br />as measured from the first Pokémon in the evolutionary family.<br /><br />For example, Tauros, Krabby, and Pichu would all be the same stage, but Pikachu would not(except in Generation 1).
GUI.wpERNoneRadioButton.toolTipText=Don't apply any evolutionary stage restriction.
GUI.wpKeepEvolutionsCheckBox.text=Keep Relations
GUI.wpKeepEvolutionsCheckBox.toolTipText=<html>If multiple Pokémon related by evolution appear in the same zone, their replacements will also be related in the same way.<br />A "zone" is the area in which a Pokémon will be replaced by the same Pokémon, as determined by the option chosen.<br />(Branched families may be merged into a single line.)<br /><br />Only checks most other restrictions (e.g. similar strength, types) against a single Pokémon in the line, so may sometimes have odd results.
GUI.wpSplitByEncounterTypesCheckBox.text=Split by encounter types
GUI.wpSplitByEncounterTypesCheckBox.toolTipText=<html>Split the game, map, or location by encounter types, such as walking, Surfing, fishing, and Rock Smash.<br />This means that (for example) a Tentacool encountered while Surfing will be replaced with a different Pokémon than a Tentacool encountered while fishing.
GUI.wpSimilarStrengthCheckBox.toolTipText=<html>If this is checked, the random Pokémon that replaces each Pokémon will be of similar power to the original.<br />However, preserving other rules such as 1-1 maps, catch 'em all, or type restrictions has precedence over this, so weaker or stronger Pokémon will be chosen if there are no other Pokémon available.
GUI.wpSimilarStrengthCheckBox.text=Similar Strength
GUI.wpCatchEmAllModeCheckBox.toolTipText=<html>If this is turned on, every random Pokémon chosen to replace an encounter will be one that hasn't been chosen before.<br />  Once every Pokémon has been chosen once, any Pokémon may be chosen (respecting other options).<br />  When used with other less restrictive options, this should make sure that every Pokémon is catchable somewhere.<br /><br />  More restrictive other options may make it logically impossible to place all Pokémon, in which case as many Pokémon as possible will be placed.<br />  E.g. with "No Legendaries"  or Generation restrictions ("Limit Pokémon") it won't be able to place those Pokémon,<br />  and "Keep Primary Type" will make it impossible to place all Dragon types in most games, as there are too few wild Dragon types to replace.
GUI.wpCatchEmAllModeCheckBox.text=Catch Em All Mode
GUI.wpUseTimeBasedEncountersCheckBox.toolTipText=<html>This affects games that have either seasons or morning/day/night encounter sets.<br />If this is checked, each of these sets will be treated as a separate "area".<br />So you will have to visit each place in morning/day/night, or in each season, to collect the Pokémon.<br />If this isn't checked, each of morning/day/night and all seasons will use the same encounter data.
GUI.wpUseTimeBasedEncountersCheckBox.text=Use Time Based Encounters
GUI.wpDontUseLegendariesCheckBox.text=Don't Use Legendaries
GUI.wpSetMinimumCatchRateCheckBox.toolTipText=<html>If this is selected, every Pokémon in the game with a catch rate below a certain level will have its catch rate increased.\n<br />The exact minimum catch rate level can be set using the slider to the right.\n<br />The percentages below assume a normal Poké Ball is used while the wild Pokémon is at full health with no status condition.\n<br /><b>Level 1:</b> "Normal" minimum catch rate. ~10% (Gens 1-4)/~18% (Gens 5+) chance for normal Pokémon, ~5% (Gens 1-4)/~10% (Gens 5+) chance for legendary Pokémon.\n<br /><b>Level 2:</b> "Buffed" minimum catch rate. ~17% (Gens 1-4)/~26% (Gens 5+) chance for normal Pokémon, ~9% (Gens 1-4)/~16% (Gens 5+) chance for legendary Pokémon.\n<br /><b>Level 3:</b> "Super" minimum catch rate. ~27% (Gens 1-4)/~37% (Gens 5+) chance for normal Pokémon, ~14% (Gens 1-4)/~22% (Gens 5+) chance for legendary Pokémon.\n<br /><b>Level 4</b>: "Ultra" minimum catch rate. ~34% (Gens 1-4)/~44% (Gens 5+) chance for all Pokémon. \n<br /><b>Level 5:</b> Guaranteed catches (every Pokémon is guaranteed to be caught, so long as they are catchable in the first place).
GUI.wpSetMinimumCatchRateCheckBox.text=Set Minimum Catch Rate:
GUI.wpRandomizeHeldItemsCheckBox.toolTipText=<html>Checking this will randomize the items held by Pokémon in the wild, including whether they can have one at all or not.<br />In some cases, these item definitions will also apply to static encounters with legendaries and the like.
GUI.wpRandomizeHeldItemsCheckBox.text=Randomize Held Items
GUI.wpBanBadItemsCheckBox.toolTipText=<html>Checking this will remove "bad" items that don't do much from the set of possible random items for wild Pokémon, such as berries and mail.
GUI.wpBanBadItemsCheckBox.text=Ban Bad Items
GUI.wpBalanceShakingGrassPokemonCheckBox.toolTipText=<html>Checking this sets an upper limit for the base stat total of wild Pokémon based on their level when using the "Similar Strength" setting.<br>This limit is high enough that it only changes abnormally strong Pokémon for the level (e.g. Geodude below level 5, Audino below level 20).<br>The level used for this calculation is the lowest level encounter with this Pokémon in the same-replacement zone.
GUI.wpBalanceShakingGrassPokemonCheckBox.text=Balance Low Level Encounters
GUI.wpPercentageLevelModifierCheckBox.toolTipText=<html>Checking this will enable a percentage-based level modifier for every wild Pokémon in the game.
GUI.wpPercentageLevelModifierCheckBox.text=Percentage Level Modifier:
GUI.wpPercentageLevelModifierSpinSlider.toolTipText=<html>Use this %s to select the percentage to change wild Pokémon levels by.<br />Negative percentages (-100 to 0) will decrease levels, and positive percentages will increase them.<br />Note that the minimal possible level is 1 and the maximal possible level is 100.
GUI.wpSetMinimumCatchRateSlider.toolTipText=<html>If Minimum Catch Rate is selected, allows you to set the level used. The percentages below assume a normal Poké Ball at full health.\n<br /><b>Level 1:</b> "Normal" minimum catch rate. ~10% (Gens 1-4)/~18% (Gens 5+) chance for normal Pokémon, ~5% (Gens 1-4)/~10% (Gens 5+) chance for legendary Pokémon.\n<br /><b>Level 2:</b> "Buffed" minimum catch rate. ~17% (Gens 1-4)/~26% (Gens 5+) chance for normal Pokémon, ~9% (Gens 1-4)/~16% (Gens 5+) chance for legendary Pokémon.\n<br /><b>Level 3:</b> "Super" minimum catch rate. ~27% (Gens 1-4)/~37% (Gens 5+) chance for normal Pokémon, ~14% (Gens 1-4)/~22% (Gens 5+) chance for legendary Pokémon.\n<br /><b>Level 4</b>: "Ultra" minimum catch rate. ~34% (Gens 1-4)/~44% (Gens 5+) chance for all Pokémon. \n<br /><b>Level 5:</b> Guaranteed catches (every Pokémon is guaranteed to be caught, so long as they are catchable in the first place).
GUI.wpTRPanel.title=Type Restrictions
GUI.wpTRThemedAreasRadioButton.toolTipText=<html>If this is chosen, every zone will have only Pokémon of a random type.<br />A "zone" is the area in which a Pokémon will be replaced by the same Pokémon, as determined by the option chosen;<br /> if the option is "Maximum possible", the zone is instead considered to be a single encounter set (Pokémon encountered in the same place using the same action).<br /><br />This may lead to a more realistic experience, or an odd one (e.g. if Fire pokemon are chosen to be in Surfing encounters).
GUI.wpTRThemedAreasRadioButton.text=Random Zone Themes
GUI.wpTRKeepPrimaryTypeRadioButton.toolTipText=<html>If this is chosen, the random Pokémon that replaces each Pokémon will have the original Pokémon's primary type.<br />For example, a Grass-Poison Pokémon could be replaced with a pure-Grass Pokémon, a Grass-Psychic Pokémon, or a Bug-Grass Pokémon.<br /><br />This tends to preserve most type theming, including "soft" type theming like forests having both Bug-type and Grass-type pokemon,<br /> at the cost of less variance in non-themed areas.
GUI.wpTRKeepPrimaryTypeRadioButton.text=Keep Primary Type
GUI.wpTRKeepThemesCheckBox.text=Keep Set/Zone Themes
GUI.wpTRKeepThemesCheckBox.toolTipText=<html>If selected, all encounter sets that originally had a type theme (all Pokémon share a type) will keep that type theme.<br />An encounter set is a set of Pokémon found in the same place at the same time when performing the same action.<br />It may occasionally have exceptions if the zone has encounter sets with conflicting type themes.<br /><br />If used with "Random Zone Themes", it will instead override the random theme only if all Pokémon in the whole zone shared a type.<br />If used with "Keep Primary Type", any theme found will be used instead of the primary type.
GUI.tmsHMsTutorsPanel.title=TM/HMs & Tutors
GUI.tmPanel.title=TMs & HMs
GUI.tmMovesPanel.title=TM Moves
GUI.tmUnchangedRadioButton.toolTipText=<html>Leave the moves in TMs as they are.<br />If Metronome Only Mode is selected, all TMs are changed to Metronome and this setting has no effect.
GUI.tmUnchangedRadioButton.text=Unchanged
GUI.tmRandomRadioButton.toolTipText=<html>Give each TM a new move.<br />HM moves are not affected, nor can they be selected to be put in TMs.<br />Each TM will still be unique.<br />If Metronome Only Mode is selected, all TMs are changed to Metronome and this setting has no effect.
GUI.tmRandomRadioButton.text=Random
GUI.tmFullHMCompatibilityCheckBox.toolTipText=<html>If you select this option, then every Pokémon will learn every HM, regardless of any other options you check.
GUI.tmFullHMCompatibilityCheckBox.text=Full HM Compatibility
GUI.tmLevelupMoveSanityCheckBox.toolTipText=<html>If you select this option, then Pokémon will be guaranteed to learn TMs of moves that they learn by levelup.<br />Otherwise, move compatibility will be left alone or decided randomly, depending on your other choices.
GUI.tmLevelupMoveSanityCheckBox.text=TM/Levelup Move Sanity
GUI.tmKeepFieldMoveTMsCheckBox.toolTipText=<html>If you select this, TMs that contain field-use moves will be left alone.<br />This includes things like Dig & Teleport, but not healing moves (Softboiled).
GUI.tmKeepFieldMoveTMsCheckBox.text=Keep Field Move TMs
GUI.tmForceGoodDamagingCheckBox.toolTipText=<html>Selecting this option will allow you to use the slider below to select a proportion of the randomized TMs to be forced to be good damaging moves.<br />Note that other TMs can still be selected as good damaging moves randomly, this is simply an additional chance.
GUI.tmForceGoodDamagingCheckBox.text=Force % of Good Damaging Moves:
GUI.tmForceGoodDamagingSpinSlider.toolTipText=<html>Use this %s to select the probability of good damaging moves for the option above.<br />Note that other TMs can still be selected as good damaging moves randomly, this is simply an additional chance.
GUI.tmNoGameBreakingMovesCheckBox.toolTipText=<html>Checking this checkbox will stop moves that can break early/late games being available in randomized TMs.<br />In first generation games, Dragon Rage, SonicBoom, Spore, and every OHKO move are banned.<br />In second generation onwards, only SonicBoom and Dragon Rage are banned (because OHKO moves and sleep are significantly less broken).
GUI.tmNoGameBreakingMovesCheckBox.text=No Game-Breaking Moves
GUI.thcPanel.title=TM/HM Compatibility
GUI.thcUnchangedRadioButton.toolTipText=<html>Every Pokémon will be able to learn the same TMs that it could before.<br />Note that this applies even if you change the TM moves, which could lead to some odd combinations.
GUI.thcUnchangedRadioButton.text=Unchanged
GUI.thcRandomPreferSameTypeRadioButton.toolTipText=<html>Randomize the TMs and HMs that each Pokémon can learn.<br />Each TM or HM will have:<br />A 90% chance of being learnable if the Pokémon has it as (one of) its type(s).<br />A 50% chance of being learnable if the move is Normal and the Pokémon isn't.<br />A 25% chance otherwise.
GUI.thcRandomPreferSameTypeRadioButton.text=Random (prefer same type)
GUI.thcRandomCompletelyRadioButton.toolTipText=<html>Randomize the TMs and HMs that each Pokémon can learn.<br />Each TM or HM will have a 50% chance of being learnable regardless of type.
GUI.thcRandomCompletelyRadioButton.text=Random (completely)
GUI.thcFullCompatibilityRadioButton.toolTipText=<html>Select this option to allow every Pokémon to learn every TM/HM.<br />This can be fun to mess around with, but it might make the game too easy.
GUI.thcFullCompatibilityRadioButton.text=Full Compatibility
GUI.mtPanel.title=Move Tutors
GUI.mtMovesPanel.title=Move Tutor Moves
GUI.mtNoExistLabel.text=This game does not have any Move Tutors, or they are not randomizable yet.
GUI.mtUnchangedRadioButton.toolTipText=<html>Leave the moves taught by tutors as they are.<br />If Metronome Only Mode is selected, all Move Tutors are changed to Metronome and this setting has no effect.
GUI.mtUnchangedRadioButton.text=Unchanged
GUI.mtRandomRadioButton.toolTipText=<html>Give each move tutor slot a new move.<br />Each Move Tutor move will still be unique, and they will not overlap with TM/HM moves.<br />If Metronome Only Mode is selected, all Move Tutors are changed to Metronome and this setting has no effect.
GUI.mtRandomRadioButton.text=Random
GUI.mtLevelupMoveSanityCheckBox.toolTipText=<html>If you select this option, then Pokémon will be guaranteed to learn move tutors of moves that they learn by levelup.<br />Otherwise, move compatibility will be left alone or decided randomly, depending on your other choices.
GUI.mtLevelupMoveSanityCheckBox.text=Tutor/Levelup Move Sanity
GUI.mtKeepFieldMoveTutorsCheckBox.toolTipText=<html>If you select this, move tutors that contain field-use moves will be left alone.<br />This includes things like Headbutt, but not healing moves (Softboiled).
GUI.mtKeepFieldMoveTutorsCheckBox.text=Keep Field Move Tutors
GUI.mtForceGoodDamagingCheckBox.toolTipText=<html>Selecting this option will allow you to use the slider below to select a proportion of the randomized tutors to be forced to be good damaging moves.<br />Note that other tutors can still be selected as good damaging moves randomly, this is simply an additional chance.
GUI.mtForceGoodDamagingCheckBox.text=Force % of Good Damaging Moves:
GUI.mtForceGoodDamagingSpinSlider.toolTipText=<html>Use this %s to select the probability of good damaging moves for the option above.<br />Note that other tutors can still be selected as good damaging moves randomly, this is simply an additional chance.
GUI.mtNoGameBreakingMovesCheckBox.toolTipText=<html>Checking this checkbox will stop moves that can break early/late games being available in randomized move tutors.<br />In first generation games, Dragon Rage, SonicBoom, Spore, and every OHKO move are banned.<br />In second generation onwards, only SonicBoom and Dragon Rage are banned (because OHKO moves and sleep are significantly less broken).
GUI.mtNoGameBreakingMovesCheckBox.text=No Game-Breaking Moves
GUI.mtcPanel.title=Move Tutor Compatibility
GUI.mtcUnchangedRadioButton.toolTipText=<html>Every Pokémon will be able to learn the same move tutor moves that it could before.<br />Note that this applies even if you randomize the moves, which could lead to some odd combinations.
GUI.mtcUnchangedRadioButton.text=Unchanged
GUI.mtcRandomPreferSameTypeRadioButton.toolTipText=<html>Randomize the Move Tutor moves that each Pokémon can learn.<br />Each move will have:<br />A 90% chance of being learnable if the Pokémon has it as (one of) its type(s).<br />A 50% chance of being learnable if the move is Normal and the Pokémon isn't.<br />A 25% chance otherwise.
GUI.mtcRandomPreferSameTypeRadioButton.text=Random (prefer same type)
GUI.mtcRandomCompletelyRadioButton.toolTipText=<html>Randomize the Move Tutor moves that each Pokémon can learn.<br />Each move will have a 50% chance of being learnable regardless of type.
GUI.mtcRandomCompletelyRadioButton.text=Random (completely)
GUI.mtcFullCompatibilityRadioButton.toolTipText=<html>Select this option to allow every Pokémon to learn every Move Tutor move.<br />This can be fun to mess around with, but it might make the game too easy.
GUI.mtcFullCompatibilityRadioButton.text=Full Compatibility
GUI.itemsPanel.title=Items
GUI.fiPanel.title=Field Items
GUI.fiUnchangedRadioButton.toolTipText=Items on the ground and hidden items remain the same.
GUI.fiUnchangedRadioButton.text=Unchanged
GUI.fiShuffleRadioButton.toolTipText=<html>Selecting this will take the full set of items that can be picked up from item balls, as well as hidden items,<br />and randomize their order so each item appears in a new place.<br />Key items are left in their original location and glitch items are excluded.<br />This stops item balls containing seriously overpowered items, but more powerful items may be available early on.<br />TMs will remain in the same item balls, but the numbers of the TMs in them will be shuffled among the set.
GUI.fiShuffleRadioButton.text=Shuffle
GUI.fiRandomRadioButton.toolTipText=<html>Selecting this will place a new random item in each item ball & hidden item slot.<br />Key items & glitch items are automatically excluded.<br />This means item balls can contain seriously overpowered items such as Master Balls.<br />TMs will remain in the same item balls, but the numbers of the TMs in them will be randomized, including TMs not usually available from item balls.<br />All TMs will still be available at least once in the game.
GUI.fiRandomRadioButton.text=Random
GUI.fiRandomEvenDistributionRadioButton.toolTipText=<html>This is the same as Random, except that the randomizer will control the number of times each item is placed. <br />This applies to the entire game, main- and post-game.
GUI.fiRandomEvenDistributionRadioButton.text=Random (even distribution)
GUI.fiBanBadItemsCheckBox.toolTipText=<html>Checking this will remove "bad" items that don't do much from the set of possible random items for field items, such as berries and mail.
GUI.fiBanBadItemsCheckBox.text=Ban Bad Items
GUI.shPanel.title=Shop Items
GUI.shSpecialPanel.title=Special Shop Items
GUI.shUnchangedRadioButton.toolTipText=Items in shops remain the same.
GUI.shUnchangedRadioButton.text=Unchanged
GUI.shShuffleRadioButton.toolTipText=Items in non-main shops are shuffled.
GUI.shShuffleRadioButton.text=Shuffle
GUI.shRandomRadioButton.toolTipText=Items in non-main shops are randomized.
GUI.shRandomRadioButton.text=Random
GUI.shBanOverpoweredShopItemsCheckBox.toolTipText=<html>Checking this will remove overpowered shop items from the pool, such as the Lucky Egg and<br />items that sell for high prices to maniacs.
GUI.shBanOverpoweredShopItemsCheckBox.text=Ban Overpowered Shop Items
GUI.shBanBadItemsCheckBox.toolTipText=<html>Checking this will remove "bad" items that don't do much from the set of possible random items for shop items, such as berries and mail.
GUI.shBanBadItemsCheckBox.text=Ban Bad Items
GUI.shBanRegularShopItemsCheckBox.toolTipText=<html>Checking this will remove regular shop items from the possible random items for shop items.
GUI.shBanRegularShopItemsCheckBox.text=Ban Regular Shop Items
GUI.shGuaranteeEvolutionItemsCheckBox.toolTipText=<html>Checking this will ensure all evolution items appear in shops.
GUI.shGuaranteeEvolutionItemsCheckBox.text=Guarantee Evolution Items
GUI.shGuaranteeXItemsCheckbox.tooltipText=<html>Checking this will ensure all X items (including Guard Spec. and Dire Hit) appear in shops.
GUI.shGuaranteeXItemsCheckbox.text=Guarantee X Items
GUI.shBalanceShopItemPricesCheckBox.toolTipText=<html>Checking this will change prices for many items in order to make them more balanced.<br /><b>Be aware:</b> prices for some items are seriously imbalanced without this setting.
GUI.shBalanceShopItemPricesCheckBox.text=Balance Shop Item Prices
GUI.shAddRareCandyCheckBox.text=Add Cheap Rare Candies
GUI.shAddRareCandyCheckBox.toolTipText=<html>Checking this will add cheap Rare Candies to all shops.<br/>(With a few exceptions, such as the HGSS Pokéathlon shops.)
GUI.puPanel.title=Pickup Items
GUI.puUnchangedRadioButton.toolTipText=Items obtained via the Pickup ability remain the same.
GUI.puUnchangedRadioButton.text=Unchanged
GUI.puRandomRadioButton.toolTipText=Items obtained via the Pickup ability are randomized.
GUI.puRandomRadioButton.text=Random
GUI.puBanBadItemsCheckBox.toolTipText=<html>Checking this will remove "bad" items that don't do much from the set of possible random items for the Pickup item table, such as berries and mail.
GUI.puBanBadItemsCheckBox.text=Ban Bad Items

GUI.forceChallengeMode.toolTipText=<html>If this is checked, then Challenge Mode will be forcibly enabled, bypassing the Key System entirely.<br /><b>You will <i>not</i> be able to access Easy or Normal Mode if you enable this setting.</b>
GUI.forceChallengeMode.text=Force Challenge Mode

