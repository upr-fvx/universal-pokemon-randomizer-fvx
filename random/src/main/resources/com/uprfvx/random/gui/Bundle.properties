GUI.tePanel.title=Type Effectiveness
GUI.teUnchangedRadioButton.text=Unchanged
GUI.teUnchangedRadioButton.toolTipText=Type weaknesses/resistances/immunities are not changed.
GUI.teRandomRadioButton.text=Random
GUI.teRandomRadioButton.ToolTipText=<html>Randomizes the Type weaknesses/resistances/immunities.<br/ > The total number of weaknesses/resistances/immunities is the same as in the base game.
GUI.teRandomBalancedRadioButton.text=Random (balanced)
GUI.teRandomBalancedRadioButton.toolTipText=Like Random, but ensures no Type has more weaknesses/resistances/immunities, offensively and defensively, than any Type in the base game.
GUI.teKeepTypeIdentitiesRadioButton.text=Keep Type Identities
GUI.teKeepTypeIdentitiesRadioButton.toolTipText=<html>Type Effectiveness is randomized, but Types keep their number of weaknesses/resistances/immunities, offensively and defensively.<br /> E.g. Normal Types will be weak to 1 Type, immune to 1, be resisted by 2 (or 1 in Gen 1), and have 1 Type be immune to them.
GUI.teInverseRadioButton.text=Inverse
GUI.teInverseRadioButton.toolTipText=<html>All weaknesses become resistances, and all resistances and immunities become weaknesses, like the Inverse Battles of Gen 6.<br /> E.g. Fire type moves become super effective against Water Pokémon, but not very effective against Grass Types.
GUI.teAddRandomImmunitiesCheckBox.text=Add Random Immunities
GUI.teAddRandomImmunitiesCheckBox.toolTipText=<html>If selected, a few weaknesses will become immunities instead of weaknesses.<br /> E.g. Grass Types might become immune to Fire Type attacks, instead of just resisting them.<br /> The number of immunities added are the same as in the base game (6 in Gen 1, 7 in Gens 2-5, 8 in Gen 6+).
GUI.teUpdateTypeEffectivenessCheckBox.toolTipText=<html>If selected, the type weaknesses/resistances/immunities will be updated to what they are in Gen 6 and up.<br />This is done before any randomization.<br><b>This does NOT add the Fairy type.</b><br />For Gen 1, this changes the following:<br /><ul><li>Ice is now not very effective against Fire.<li>Poison is now neutral against Bug.<li>Bug is now not very effective against Poison.<li>Ghost is now super effective against Psychic.</ul>For Gens 2-5, this changes the following:<br /><ul><li>Ghost is now neutral against Steel.<li>Dark is now neutral against Steel.</ul>
GUI.teUpdateTypeEffectivenessCheckBox.text=Update Type Effectiveness



