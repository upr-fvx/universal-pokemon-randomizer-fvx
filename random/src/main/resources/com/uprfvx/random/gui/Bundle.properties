GUI.ppalPanel.title=Pokémon Palettes
GUI.ppalUnchangedRadioButton.text=Unchanged
GUI.ppalUnchangedRadioButton.toolTipText=Pokémon palettes remain the same.
GUI.ppalRandomRadioButton.text=Random
GUI.ppalRandomRadioButton.toolTipText=Selecting this will give each Pokémon a random color palette.
GUI.ppalFollowTypesCheckBox.text=Follow Types
GUI.ppalFollowTypesCheckBox.toolTipText=<html>When this is selected, Pokémon colors will depend on type. <br /> For example, a Fire-type Bulbasaur might be red, and a Grass-type Groudon might be green.
GUI.ppalFollowEvolutionsCheckBox.text=Follow Evolutions
GUI.ppalFollowEvolutionsCheckBox.toolTipText=<html>When this is selected, each Pokémon species will have colors similar to those it evolves to/from.<br>\nWhen evolutions are randomized, Pokémon get colors similar to their new evolutions/prevolutions.<br>\nIf "Follow Types" is selected, a Pokémon that gets a new type upon evolution may have its colors reflecting this.
GUI.ppalShinyFromNormalCheckBox.text=Shiny From Normal
GUI.ppalShinyFromNormalCheckBox.toolTipText=<html>When this is selected, the shiny colors of each Pokémon species becomes the colors it would normally have, if palettes were not randomized.
GUI.ppalNotExistLabel=This game does not have any Pokémon Palettes, or they are not randomizable yet.
GUI.ppalPartiallyImplementedLabel=<html>This game has support for randomizing Pokémon Palettes, but not all of them yet.<br>Be aware that even if you check the buttons below, not all (or only a few) Pokémon Palettes will be randomized.
